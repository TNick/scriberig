name: Publish GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - CLI_REFERENCE.md
      - design/**
      - crates/**
      - apps/**
      - web/**
      - Cargo.lock
      - Cargo.toml
      - Makefile
      - mkdocs.yml
      - .github/workflows/github-pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install documentation tooling
        run: python -m pip install "mkdocs-material>=9,<10"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Normalize legacy pnpm registry URLs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote
          import re

          lockfile = Path("web/pnpm-lock.yaml")
          content = lockfile.read_text(encoding="utf-8")
          content = re.sub(
              r"http://127\.0\.0\.1:4873/([^,}\s]+)",
              lambda match: "https://registry.npmjs.org/" + unquote(match.group(1)),
              content,
          )
          lockfile.write_text(content, encoding="utf-8")
          PY

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Build API documentation
        run: make docs

      - name: Validate generated API documentation
        shell: bash
        run: |
          test -f target/doc/typescript/index.html
          rust_index="$(find target/doc -mindepth 2 -maxdepth 2 -type f -name index.html ! -path 'target/doc/typescript/*' -print -quit)"
          test -n "$rust_index"

      - name: Stage canonical Markdown for the site
        shell: bash
        run: |
          rm -rf .pages
          mkdir -p .pages/docs
          cp README.md .pages/docs/index.md
          cp CLI_REFERENCE.md .pages/docs/cli-reference.md
          cp -R design/level-1 .pages/docs/
          cp -R design/level-2 .pages/docs/
          cp -R design/level-3 .pages/docs/

          mkdir -p .pages/docs/api/rust .pages/docs/api/typescript
          for entry in target/doc/*; do
            if [ "${entry##*/}" != "typescript" ]; then
              cp -R "$entry" .pages/docs/api/rust/
            fi
          done
          cp -R target/doc/typescript/. .pages/docs/api/typescript/

          {
            echo "# API Reference"
            echo
            echo "These references are rebuilt from the current Rust workspace and public TypeScript packages whenever GitHub Pages is published."
            echo
            echo "## Rust"
            echo
            echo "Generated with \`cargo doc --workspace --no-deps\`."
            echo
            for index in target/doc/*/index.html; do
              [ -f "$index" ] || continue
              crate="${index#target/doc/}"
              crate="${crate%/index.html}"
              [ "$crate" = "typescript" ] && continue
              printf -- '- [`%s`](rust/%s/index.html)\n' "$crate" "$crate"
            done
            echo
            echo "## TypeScript"
            echo
            echo "[Browse the generated TypeScript API documentation](typescript/index.html)."
          } > .pages/docs/api/index.md

      - name: Validate staged site
        shell: bash
        run: |
          test -f .pages/docs/cli-reference.md
          test -f .pages/docs/api/index.md
          test -f .pages/docs/api/typescript/index.html
          test -n "$(find .pages/docs/api/rust -mindepth 2 -maxdepth 2 -type f -name index.html -print -quit)"
          mkdocs build --clean

      - name: Publish gh-pages branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force --clean
