name: Publish GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - design/**
      - mkdocs.yml
      - .github/workflows/github-pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Install documentation tooling
        run: python -m pip install "mkdocs-material>=9,<10"

      - name: Stage canonical Markdown for the site
        shell: bash
        run: |
          rm -rf .pages
          mkdir -p .pages/docs
          cp README.md .pages/docs/index.md
          cp -R design/level-1 .pages/docs/
          cp -R design/level-2 .pages/docs/
          cp -R design/level-3 .pages/docs/

      - name: Publish gh-pages branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force --clean
