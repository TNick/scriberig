name: Publish GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - design/**
      - crates/**
      - apps/**
      - web/**
      - Cargo.lock
      - Cargo.toml
      - Makefile
      - mkdocs.yml
      - .github/workflows/github-pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install documentation tooling
        run: python -m pip install "mkdocs-material>=9,<10"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Normalize legacy pnpm registry URLs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote
          import re

          lockfile = Path("web/pnpm-lock.yaml")
          content = lockfile.read_text(encoding="utf-8")
          content = re.sub(
              r"http://127\.0\.0\.1:4873/([^,}\s]+)",
              lambda match: "https://registry.npmjs.org/" + unquote(match.group(1)),
              content,
          )
          lockfile.write_text(content, encoding="utf-8")
          PY

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Build API documentation
        run: make docs

      - name: Stage canonical Markdown for the site
        shell: bash
        run: |
          rm -rf .pages
          mkdir -p .pages/docs
          cp README.md .pages/docs/index.md
          cp -R design/level-1 .pages/docs/
          cp -R design/level-2 .pages/docs/
          cp -R design/level-3 .pages/docs/
          mkdir -p .pages/docs/api/rust .pages/docs/api/typescript
          for entry in target/doc/*; do
            if [ "${entry##*/}" != "typescript" ]; then
              cp -R "$entry" .pages/docs/api/rust/
            fi
          done
          cp -R target/doc/typescript/. .pages/docs/api/typescript/
          cat > .pages/docs/api/index.md <<'EOF'
          # API Reference

          ## Rust

          [Browse the Rust API documentation](rust/srig/index.html)

          ## TypeScript

          [Browse the TypeScript API documentation](typescript/index.html)
          EOF

      - name: Publish gh-pages branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force --clean
