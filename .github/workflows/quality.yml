name: quality

on:
  push:
  pull_request:

jobs:
  conventions:
    runs-on: debian-13
    container:
      image: 10.225.224.10/ci/debian:13
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/lint_repo.py

  rust:
    runs-on: debian-13
    container:
      image: 10.225.224.10/ci/debian:13
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: debian-13
    container:
      image: 10.225.224.10/ci/debian:13
    steps:
      - uses: actions/checkout@v4
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web format:check
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test

  product-golden:
    needs: [conventions, rust, web]
    runs-on: debian-13
    container:
      image: 10.225.224.10/ci/debian:13
    steps:
      - uses: actions/checkout@v4
      - run: pnpm --dir web install --frozen-lockfile
      - run: python3 tools/product_golden.py
