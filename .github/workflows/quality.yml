# Run all project quality checks in one prebuilt toolchain container.
name: quality

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  product-tests:
    timeout-minutes: 120
    runs-on: docker-host
    steps:
      - uses: actions/checkout@v4
      - name: Test product application in isolated container
        run: |
          set -euxo pipefail
          docker run --rm --privileged --network host \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            10.225.224.10/ci/debian:13 \
            bash -euo pipefail -c '
              apt-get update
              apt-get install --yes bubblewrap
              rustc --version
              cargo --version
              bwrap --unshare-all --cap-drop ALL --clearenv --dev /dev --tmpfs /tmp \
                --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib \
                --ro-bind /lib64 /lib64 --chdir /tmp -- /usr/bin/true
              cargo test --locked -p scriberig
            '

  quality:
    timeout-minutes: 120
    runs-on: debian-13
    container:
      image: 10.225.224.10/ci/debian:13
    steps:
      - uses: actions/checkout@v4
      - name: Record Rust compiler version
        id: rust-version
        run: echo "version=$(rustc -V | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache Rust dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/build
            target/debug/.fingerprint
            target/debug/deps/*.rlib
            target/debug/deps/*.rmeta
            target/debug/deps/*.so
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ forgejo.sha }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Configure pnpm package store
        id: pnpm-store
        run: |
          pnpm config set store-dir "$GITHUB_WORKSPACE/.pnpm-store"
          echo "version=$(pnpm --version)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm packages
        uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm-store.outputs.version }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - run: python3 tools/lint_repo.py
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --exclude scriberig
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web format:check
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test
      - run: python3 tools/product_golden.py
