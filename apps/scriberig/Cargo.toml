[package]
name = "scriberig"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
description = "Integrated Scriberig executable composition root."
repository.workspace = true
publish = false

[features]
default = ["isolated-plugin-worker"]
isolated-plugin-worker = ["scriberig-agent-runtime/isolated-plugin-worker"]

[[bin]]
name = "srig"
path = "src/main.rs"

[dependencies]
scriberig-secrets = { path = "../../crates/scriberig-secrets" }
rpassword = "7"
scriberig-agent-core = { path = "../../crates/scriberig-agent-core" }
scriberig-agent-runtime = { path = "../../crates/scriberig-agent-runtime" }
scriberig-app = { path = "../../crates/scriberig-app" }
scriberig-cli = { path = "../../crates/scriberig-cli" }
scriberig-project = { path = "../../crates/scriberig-project" }
scriberig-protocol = { path = "../../crates/scriberig-protocol" }
scriberig-server = { path = "../../crates/scriberig-server" }
scriberig-store-sqlite = { path = "../../crates/scriberig-store-sqlite" }
scriberig-store = { path = "../../crates/scriberig-store" }
scriberig-session-sqlite = { path = "../../crates/scriberig-session-sqlite" }
scriberig-session = { path = "../../crates/scriberig-session" }
scriberig-tui = { path = "../../crates/scriberig-tui" }
scriberig-client = { path = "../../crates/scriberig-client" }
scriberig-core = { path = "../../crates/scriberig-core" }
scriberig-domain-ecma = { path = "../../crates/domains/scriberig-domain-ecma" }
scriberig-domain-rust = { path = "../../crates/domains/scriberig-domain-rust" }
scriberig-style-sqlite = { path = "../../crates/scriberig-style-sqlite" }
sr-projection = { path = "../../crates/sr-projection" }
rpi-ai = { workspace = true }
rpi-agent = { workspace = true }
rpi-extensions = { workspace = true }
rpi-model-runtime = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
scriberig-query = { path = "../../crates/scriberig-query" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ctrlc = "3.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1"

[dev-dependencies]
scriberig-test-provider-plugin = { path = "../../tests/fixtures/provider-worker-plugin" }
scriberig-store-memory = { path = "../../crates/scriberig-store-memory" }
sr-change = { path = "../../crates/sr-change" }
tempfile = "3"
portable-pty = "0.9"
vt100 = "0.15.2"

[lints]
workspace = true
