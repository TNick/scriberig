<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Reusable platform beneath the integrated Scriberig product</title>
  <desc id="desc">Two architectural layers are shown. The lower Apache-2.0 reusable platform contains storage, graph and schema, query and migration, projections and adapters, protocol and clients, UI libraries, and reusable agent abstractions. The upper AGPL-3.0 integrated product contains the reference server, agent runtime, editor, and product workflows. Third-party applications connect to the public platform layer without adopting the integrated product.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>
      .title{font:700 30px system-ui,sans-serif;fill:#0f172a}.layer{font:700 24px system-ui,sans-serif;fill:#0f172a}.label{font:700 18px system-ui,sans-serif;fill:#0f172a}.body{font:16px system-ui,sans-serif;fill:#334155}.small{font:14px system-ui,sans-serif;fill:#475569}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="title">Platform below, integrated product above</text>

  <rect x="120" y="95" width="960" height="235" rx="24" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
  <text x="160" y="140" class="layer">Integrated Scriberig product — AGPL-3.0</text>
  <text x="160" y="170" class="body">Opinionated runtime assembled from public platform capabilities</text>

  <rect x="160" y="200" width="200" height="85" rx="14" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="260" y="235" text-anchor="middle" class="label">Reference server</text>
  <text x="260" y="260" text-anchor="middle" class="small">hosted product API</text>
  <rect x="385" y="200" width="200" height="85" rx="14" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="485" y="235" text-anchor="middle" class="label">Agent runtime</text>
  <text x="485" y="260" text-anchor="middle" class="small">integrated orchestration</text>
  <rect x="610" y="200" width="200" height="85" rx="14" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="710" y="235" text-anchor="middle" class="label">Editor app</text>
  <text x="710" y="260" text-anchor="middle" class="small">complete Scriberig UI</text>
  <rect x="835" y="200" width="200" height="85" rx="14" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="935" y="235" text-anchor="middle" class="label">Product workflows</text>
  <text x="935" y="260" text-anchor="middle" class="small">opinionated coordination</text>

  <rect x="120" y="390" width="960" height="250" rx="24" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="160" y="435" class="layer">Reusable semantic platform — Apache-2.0</text>
  <text x="160" y="465" class="body">Stable public building blocks usable with or without Scriberig agents</text>

  <rect x="155" y="500" width="205" height="90" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="258" y="535" text-anchor="middle" class="label">Store · graph · schema</text>
  <text x="258" y="562" text-anchor="middle" class="small">identity and knowledge core</text>
  <rect x="380" y="500" width="205" height="90" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="483" y="535" text-anchor="middle" class="label">Query · migration</text>
  <text x="483" y="562" text-anchor="middle" class="small">shared semantic operations</text>
  <rect x="605" y="500" width="205" height="90" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="708" y="535" text-anchor="middle" class="label">Adapters · projections</text>
  <text x="708" y="562" text-anchor="middle" class="small">domain specialization</text>
  <rect x="830" y="500" width="205" height="90" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="933" y="535" text-anchor="middle" class="label">Protocol · UI · SDKs</text>
  <text x="933" y="562" text-anchor="middle" class="small">public integration surfaces</text>

  <path d="M600 390 L600 330" class="line"/>
  <text x="620" y="365" class="small">public platform APIs</text>

  <rect x="20" y="435" width="85" height="150" rx="16" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <text x="62" y="472" text-anchor="middle" class="label">3rd</text>
  <text x="62" y="496" text-anchor="middle" class="label">party</text>
  <text x="62" y="530" text-anchor="middle" class="small">apps</text>
  <text x="62" y="551" text-anchor="middle" class="small">editors</text>
  <path d="M105 510 L150 510" class="line"/>
</svg>