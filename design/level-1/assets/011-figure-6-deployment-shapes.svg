<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Three deployment shapes preserve the same application semantics</title><desc id="desc">Three columns show in-process embedding, a local Scriberig server, and a remote Scriberig service. Each shape uses the same application operations and semantic protocol even though process boundaries differ. The store is local in the first two examples and managed behind the service in the third.</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  <style>
    .title{font:700 30px system-ui,sans-serif;fill:#0f172a}.subtitle{font:600 17px system-ui,sans-serif;fill:#475569}.label{font:700 20px system-ui,sans-serif;fill:#0f172a}.body{font:16px system-ui,sans-serif;fill:#334155}.small{font:14px system-ui,sans-serif;fill:#475569}.tiny{font:13px system-ui,sans-serif;fill:#64748b}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}.blue{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrowBlue)}
  </style>
</defs><rect width="1200" height="700" fill="#ffffff"/>
<text x="600" y="48" text-anchor="middle" class="title">Deployment shape changes; semantics do not</text><text x="600" y="78" text-anchor="middle" class="subtitle">In-process, local-server, and remote-service deployments share the same operation model.</text>
<g>
<rect x="45" y="125" width="340" height="500" rx="22" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/><text x="215" y="165" text-anchor="middle" class="label">1. In-process</text><text x="215" y="193" text-anchor="middle" class="small">embedded tools · tests · utilities</text>
<rect x="90" y="245" width="250" height="72" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/><text x="215" y="289" text-anchor="middle" class="label">Application</text><path d="M215 317 L215 360" class="line"/><rect x="90" y="360" width="250" height="72" rx="14" fill="#ecfdf5" stroke="#0f766e" stroke-width="2.5"/><text x="215" y="404" text-anchor="middle" class="label">Operations + libraries</text><path d="M215 432 L215 475" class="line"/><rect x="90" y="475" width="250" height="72" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="215" y="519" text-anchor="middle" class="label">Local store</text>

<rect x="430" y="125" width="340" height="500" rx="22" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/><text x="600" y="165" text-anchor="middle" class="label">2. Local server</text><text x="600" y="193" text-anchor="middle" class="small">desktop development environment</text>
<rect x="475" y="225" width="250" height="72" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2.5"/><text x="600" y="269" text-anchor="middle" class="label">CLI / TUI / browser</text><path d="M600 297 L600 340" class="line"/><rect x="475" y="340" width="250" height="72" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/><text x="600" y="384" text-anchor="middle" class="label">Local server</text><path d="M600 412 L600 455" class="line"/><rect x="475" y="455" width="250" height="72" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="600" y="499" text-anchor="middle" class="label">Local store</text>

<rect x="815" y="125" width="340" height="500" rx="22" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/><text x="985" y="165" text-anchor="middle" class="label">3. Remote service</text><text x="985" y="193" text-anchor="middle" class="small">shared / hosted environment</text>
<rect x="860" y="225" width="250" height="72" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2.5"/><text x="985" y="269" text-anchor="middle" class="label">Client applications</text><path d="M985 297 L985 340" class="line"/><rect x="860" y="340" width="250" height="72" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/><text x="985" y="384" text-anchor="middle" class="label">Remote service</text><path d="M985 412 L985 455" class="line"/><rect x="860" y="455" width="250" height="72" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text x="985" y="499" text-anchor="middle" class="label">Managed store</text>
</g>
<text x="600" y="665" text-anchor="middle" class="body">The process boundary moves; inspect/query/apply semantics and snapshot awareness stay equivalent.</text>
</svg>