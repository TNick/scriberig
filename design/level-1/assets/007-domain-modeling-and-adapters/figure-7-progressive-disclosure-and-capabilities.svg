<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Generic clients navigate domains through progressive disclosure and capability discovery</title>
  <desc id="desc">Four vertical ladders show natural inspection levels for Markdown, code, PDF, and session domains. A generic client inspects an entity and receives descriptions, child counts, available relations, projections, analyses, and semantic commands, then drills into finer levels only when useful.</desc>
  <style>
    .title{font:700 29px system-ui,sans-serif;fill:#0f172a}.head{font:700 19px system-ui,sans-serif;fill:#0f172a}.body{font:15px system-ui,sans-serif;fill:#334155}.small{font:14px system-ui,sans-serif;fill:#475569}.step{fill:#ffffff;stroke:#94a3b8;stroke-width:2}.spine{stroke:#64748b;stroke-width:3}
  </style>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="46" text-anchor="middle" class="title">Generic navigation stays universal while domain meaning stays rich</text>

  <rect x="50" y="90" width="1100" height="105" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="600" y="126" text-anchor="middle" class="head">inspect(entity)</text>
  <text x="600" y="157" text-anchor="middle" class="body">description · child counts · relations · projections · analyses · semantic commands · validation capabilities</text>
  <text x="600" y="181" text-anchor="middle" class="small">The client does not need to know every installed domain in advance.</text>

  <text x="170" y="245" text-anchor="middle" class="head">Markdown</text>
  <line x1="170" y1="270" x2="170" y2="665" class="spine"/>
  <rect x="85" y="280" width="170" height="55" rx="12" class="step"/><text x="170" y="314" text-anchor="middle" class="body">Document</text>
  <rect x="85" y="365" width="170" height="55" rx="12" class="step"/><text x="170" y="399" text-anchor="middle" class="body">Section</text>
  <rect x="85" y="450" width="170" height="55" rx="12" class="step"/><text x="170" y="484" text-anchor="middle" class="body">Block</text>
  <rect x="85" y="535" width="170" height="55" rx="12" class="step"/><text x="170" y="569" text-anchor="middle" class="body">Paragraph / Table</text>
  <rect x="85" y="620" width="170" height="55" rx="12" class="step"/><text x="170" y="654" text-anchor="middle" class="body">Cell / Inline</text>

  <text x="455" y="245" text-anchor="middle" class="head">Code</text>
  <line x1="455" y1="270" x2="455" y2="665" class="spine"/>
  <rect x="370" y="280" width="170" height="55" rx="12" class="step"/><text x="455" y="314" text-anchor="middle" class="body">Project / Module</text>
  <rect x="370" y="365" width="170" height="55" rx="12" class="step"/><text x="455" y="399" text-anchor="middle" class="body">Function / Type</text>
  <rect x="370" y="450" width="170" height="55" rx="12" class="step"/><text x="455" y="484" text-anchor="middle" class="body">CodeGroup</text>
  <rect x="370" y="535" width="170" height="55" rx="12" class="step"/><text x="455" y="569" text-anchor="middle" class="body">Statement</text>
  <rect x="370" y="620" width="170" height="55" rx="12" class="step"/><text x="455" y="654" text-anchor="middle" class="body">Expression</text>

  <text x="745" y="245" text-anchor="middle" class="head">PDF</text>
  <line x1="745" y1="270" x2="745" y2="665" class="spine"/>
  <rect x="660" y="280" width="170" height="55" rx="12" class="step"/><text x="745" y="314" text-anchor="middle" class="body">Document</text>
  <rect x="660" y="365" width="170" height="55" rx="12" class="step"/><text x="745" y="399" text-anchor="middle" class="body">Page</text>
  <rect x="660" y="450" width="170" height="55" rx="12" class="step"/><text x="745" y="484" text-anchor="middle" class="body">Region</text>
  <rect x="660" y="535" width="170" height="55" rx="12" class="step"/><text x="745" y="569" text-anchor="middle" class="body">Paragraph / Table</text>
  <rect x="660" y="620" width="170" height="55" rx="12" class="step"/><text x="745" y="654" text-anchor="middle" class="body">Row / Cell</text>

  <text x="1030" y="245" text-anchor="middle" class="head">Session</text>
  <line x1="1030" y1="270" x2="1030" y2="665" class="spine"/>
  <rect x="945" y="280" width="170" height="55" rx="12" class="step"/><text x="1030" y="314" text-anchor="middle" class="body">Session</text>
  <rect x="945" y="365" width="170" height="55" rx="12" class="step"/><text x="1030" y="399" text-anchor="middle" class="body">Branch</text>
  <rect x="945" y="450" width="170" height="55" rx="12" class="step"/><text x="1030" y="484" text-anchor="middle" class="body">Episode / Turn</text>
  <rect x="945" y="535" width="170" height="55" rx="12" class="step"/><text x="1030" y="569" text-anchor="middle" class="body">Message / Tool</text>
  <rect x="945" y="620" width="170" height="55" rx="12" class="step"/><text x="1030" y="654" text-anchor="middle" class="body">Exact content</text>

  <text x="600" y="720" text-anchor="middle" class="small">Descriptions and counts make the cheapest representation useful; consumers descend only when the task requires more detail.</text>
</svg>