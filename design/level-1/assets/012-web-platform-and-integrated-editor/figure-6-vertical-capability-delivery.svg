<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">A user-visible capability is developed vertically across all supported product surfaces</title>
  <desc id="desc">A vertical stack uses semantic diff as an example capability. It passes through core application operations, protocol types, server transport, web client, browser interaction model, integrated editor, CLI or TUI, and the agent tool layer. A side comparison marks an anti-pattern where backend capability count grows while web support lags. The intended model treats the capability as complete only when the required surfaces can all expose it consistently.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>.title{font:700 30px system-ui,sans-serif;fill:#0f172a}.label{font:700 19px system-ui,sans-serif;fill:#0f172a}.body{font:16px system-ui,sans-serif;fill:#334155}.small{font:14px system-ui,sans-serif;fill:#475569}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="title">Develop capabilities vertically, not one product surface at a time</text>

  <rect x="385" y="85" width="430" height="55" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="600" y="120" text-anchor="middle" class="label">Semantic diff: application operation</text>
  <rect x="385" y="160" width="430" height="55" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="600" y="195" text-anchor="middle" class="label">Protocol representation</text>
  <rect x="385" y="235" width="430" height="55" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="3"/>
  <text x="600" y="270" text-anchor="middle" class="label">Server transport</text>
  <rect x="385" y="310" width="430" height="55" rx="14" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
  <text x="600" y="345" text-anchor="middle" class="label">Web client + semantic model</text>
  <rect x="385" y="385" width="430" height="55" rx="14" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
  <text x="600" y="420" text-anchor="middle" class="label">Browser interaction model</text>
  <rect x="385" y="460" width="430" height="55" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
  <text x="600" y="495" text-anchor="middle" class="label">Reference integrated editor</text>
  <rect x="385" y="535" width="205" height="55" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="488" y="570" text-anchor="middle" class="label">CLI / TUI</text>
  <rect x="610" y="535" width="205" height="55" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="712" y="570" text-anchor="middle" class="label">Agent tool</text>

  <path d="M600 140 L600 160" class="line"/><path d="M600 215 L600 235" class="line"/><path d="M600 290 L600 310" class="line"/><path d="M600 365 L600 385" class="line"/><path d="M600 440 L600 460" class="line"/>
  <path d="M560 515 C535 525 510 530 500 535" class="line"/><path d="M640 515 C665 525 690 530 700 535" class="line"/>

  <rect x="55" y="135" width="250" height="345" rx="20" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="180" y="175" text-anchor="middle" class="label">Anti-pattern</text>
  <text x="180" y="215" text-anchor="middle" class="body">core libraries</text><rect x="105" y="230" width="150" height="22" rx="8" fill="#dc2626" opacity="0.85"/>
  <text x="180" y="285" text-anchor="middle" class="body">CLI</text><rect x="105" y="300" width="125" height="22" rx="8" fill="#dc2626" opacity="0.7"/>
  <text x="180" y="355" text-anchor="middle" class="body">API</text><rect x="105" y="370" width="80" height="22" rx="8" fill="#dc2626" opacity="0.55"/>
  <text x="180" y="425" text-anchor="middle" class="body">web editor</text><rect x="105" y="440" width="38" height="22" rx="8" fill="#dc2626" opacity="0.4"/>

  <rect x="895" y="180" width="250" height="275" rx="20" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
  <text x="1020" y="220" text-anchor="middle" class="label">Completion rule</text>
  <text x="1020" y="265" text-anchor="middle" class="body">A capability is not</text>
  <text x="1020" y="291" text-anchor="middle" class="body">“done” just because the</text>
  <text x="1020" y="317" text-anchor="middle" class="body">Rust implementation exists.</text>
  <text x="1020" y="365" text-anchor="middle" class="body">Important user-facing</text>
  <text x="1020" y="391" text-anchor="middle" class="body">surfaces must expose the</text>
  <text x="1020" y="417" text-anchor="middle" class="body">same semantic capability.</text>

  <text x="600" y="650" text-anchor="middle" class="body">The reference editor acts as a conformance application for the public web stack.</text>
</svg>