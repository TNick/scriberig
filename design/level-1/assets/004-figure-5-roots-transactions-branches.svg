<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Atomic named roots over immutable snapshots and branches</title>
  <desc id="desc">A named root called main initially points to immutable snapshot S42. A transaction prepares new revisions and snapshot S43 off to the side, validates them, and atomically moves main from S42 to S43 using the expected old value. A separate branch root can continue to point to S44 derived from S42 without copying S42. Failed or unpromoted work remains unreachable rather than becoming partially visible.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>.title{font:700 29px system-ui,sans-serif;fill:#0f172a}.label{font:700 21px system-ui,sans-serif;fill:#0f172a}.body{font:16px system-ui,sans-serif;fill:#334155}.small{font:14px system-ui,sans-serif;fill:#475569}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:3;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="46" text-anchor="middle" class="title">Named roots move atomically; snapshots never do</text>

  <rect x="70" y="120" width="230" height="96" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="185" y="159" text-anchor="middle" class="label">Named root: main</text>
  <text x="185" y="190" text-anchor="middle" class="small">stable mutable reference</text>

  <rect x="420" y="112" width="250" height="112" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="545" y="154" text-anchor="middle" class="label">Snapshot S42</text>
  <text x="545" y="184" text-anchor="middle" class="body">immutable base</text>
  <text x="545" y="207" text-anchor="middle" class="small">shared by later branches</text>
  <path d="M300 168 L420 168" class="line"/>
  <text x="360" y="149" text-anchor="middle" class="small">current</text>

  <rect x="420" y="330" width="250" height="112" rx="18" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
  <text x="545" y="372" text-anchor="middle" class="label">Snapshot S43</text>
  <text x="545" y="402" text-anchor="middle" class="body">prepared + validated</text>
  <text x="545" y="425" text-anchor="middle" class="small">new canonical candidate</text>
  <path d="M545 224 L545 330" class="dash"/>
  <text x="620" y="283" class="small">new revisions + shared state</text>

  <rect x="815" y="112" width="250" height="112" rx="18" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
  <text x="940" y="154" text-anchor="middle" class="label">Snapshot S44</text>
  <text x="940" y="184" text-anchor="middle" class="body">independent branch</text>
  <text x="940" y="207" text-anchor="middle" class="small">also derived from S42</text>
  <path d="M670 168 L815 168" class="dash"/>

  <rect x="805" y="270" width="270" height="96" rx="18" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
  <text x="940" y="309" text-anchor="middle" class="label">Named root: feature</text>
  <text x="940" y="340" text-anchor="middle" class="small">feature → S44</text>
  <path d="M940 270 L940 224" class="line"/>

  <rect x="125" y="320" width="230" height="150" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
  <text x="240" y="356" text-anchor="middle" class="label">Transaction</text>
  <text x="240" y="389" text-anchor="middle" class="body">1. prepare objects</text>
  <text x="240" y="419" text-anchor="middle" class="body">2. validate state</text>
  <text x="240" y="449" text-anchor="middle" class="body">3. compare + promote</text>
  <path d="M355 395 L420 386" class="line"/>

  <path d="M420 430 C315 505 205 500 185 216" stroke="#0f766e" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="305" y="525" text-anchor="middle" class="small">atomic main: S42 → S43 if expected value is still S42</text>

  <rect x="245" y="575" width="710" height="82" rx="17" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="607" text-anchor="middle" class="body">Readers see either the complete old world S42 or the complete new world S43.</text>
  <text x="600" y="635" text-anchor="middle" class="body">Branches reference immutable snapshots; they do not copy the knowledge universe.</text>
</svg>
