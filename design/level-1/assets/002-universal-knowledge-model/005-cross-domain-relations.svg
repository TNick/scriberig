<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Cross-domain relations in one knowledge graph</title>
  <desc id="desc">Entities from sessions, source code, documents, PDFs, migrations, and project knowledge connect through typed relations without copying objects between separate stores.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.session{fill:#eef2ff;stroke:#6366f1;stroke-width:2}.code{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.doc{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.pdf{fill:#fefce8;stroke:#ca8a04;stroke-width:2}.change{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.knowledge{fill:#fdf2f8;stroke:#db2777;stroke-width:2}.title{font:700 30px system-ui,sans-serif;fill:#0f172a}.h{font:700 19px system-ui,sans-serif;fill:#0f172a}.small{font:500 15px system-ui,sans-serif;fill:#475569}.label{font:600 14px system-ui,sans-serif;fill:#334155}.line{stroke:#64748b;stroke-width:2.2;fill:none}.arrow{marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="1200" height="720" rx="24"/>
  <text class="title" x="600" y="48" text-anchor="middle">Cross-domain knowledge is connected, not copied</text>

  <rect class="session" x="70" y="115" width="250" height="92" rx="16"/>
  <text class="h" x="195" y="151" text-anchor="middle">SessionBranch B81</text>
  <text class="small" x="195" y="179" text-anchor="middle">cache investigation</text>

  <rect class="code" x="475" y="100" width="250" height="92" rx="16"/>
  <text class="h" x="600" y="136" text-anchor="middle">Function F</text>
  <text class="small" x="600" y="164" text-anchor="middle">render_cached</text>

  <rect class="knowledge" x="865" y="115" width="250" height="92" rx="16"/>
  <text class="h" x="990" y="151" text-anchor="middle">Decision D19</text>
  <text class="small" x="990" y="179" text-anchor="middle">cache exact immutable inputs</text>

  <rect class="doc" x="90" y="365" width="250" height="92" rx="16"/>
  <text class="h" x="215" y="401" text-anchor="middle">Paragraph P</text>
  <text class="small" x="215" y="429" text-anchor="middle">architecture explanation</text>

  <rect class="pdf" x="475" y="500" width="250" height="92" rx="16"/>
  <text class="h" x="600" y="536" text-anchor="middle">PDFTable T</text>
  <text class="small" x="600" y="564" text-anchor="middle">external evidence</text>

  <rect class="change" x="860" y="365" width="250" height="92" rx="16"/>
  <text class="h" x="985" y="401" text-anchor="middle">Migration M42</text>
  <text class="small" x="985" y="429" text-anchor="middle">semantic project change</text>

  <path class="line arrow" d="M320 153 C385 153 415 146 475 146"/>
  <text class="label" x="397" y="132" text-anchor="middle">touches</text>

  <path class="line arrow" d="M725 146 C790 146 815 153 865 153"/>
  <text class="label" x="795" y="132" text-anchor="middle">informs</text>

  <path class="line arrow" d="M320 186 C520 260 760 270 885 207"/>
  <text class="label" x="603" y="252" text-anchor="middle">derived_from</text>

  <path class="line arrow" d="M340 411 C520 411 680 295 865 179"/>
  <text class="label" x="590" y="374" text-anchor="middle">describes</text>

  <path class="line arrow" d="M600 500 C655 458 750 427 860 411"/>
  <text class="label" x="705" y="445" text-anchor="middle">supports</text>

  <path class="line arrow" d="M860 439 C735 520 500 600 315 207"/>
  <text class="label" x="600" y="588" text-anchor="middle">produced_by agent branch</text>

  <path class="line arrow" d="M865 196 C790 260 735 335 690 500"/>
  <text class="label" x="765" y="339" text-anchor="middle">references evidence</text>

  <text class="small" x="600" y="675" text-anchor="middle">Typed relations cross domain boundaries while every entity keeps its own identity, history, and provenance.</text>
</svg>