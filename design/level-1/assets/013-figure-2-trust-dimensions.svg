<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Orthogonal trust dimensions around a knowledge object</title>
  <desc id="desc">A central knowledge object is evaluated separately by content identity, provenance, validation evidence, authority, freshness, and method-specific confidence. No single trusted flag replaces these dimensions.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.h{font:700 28px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}.t{font:600 20px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}.s{font:400 17px system-ui,-apple-system,Segoe UI,sans-serif;fill:#334155}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:14}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14}.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:2;rx:14}.amber{fill:#fffbeb;stroke:#d97706;stroke-width:2;rx:14}.purple{fill:#faf5ff;stroke:#9333ea;stroke-width:2;rx:14}.line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="55" class="h">Trust is not one score: six questions remain separate</text>
  <rect x="430" y="225" width="340" height="160" class="blue"/><text x="600" y="270" text-anchor="middle" class="t">Knowledge object / revision</text><text x="600" y="305" text-anchor="middle" class="s">exact content and semantic identity</text><text x="600" y="335" text-anchor="middle" class="s">canonical, candidate, or derived</text>
  <rect x="90" y="105" width="245" height="92" class="box"/><text x="212" y="140" text-anchor="middle" class="t">Content identity</text><text x="212" y="170" text-anchor="middle" class="s">what exact bytes/value?</text>
  <rect x="90" y="255" width="245" height="92" class="purple"/><text x="212" y="290" text-anchor="middle" class="t">Provenance</text><text x="212" y="320" text-anchor="middle" class="s">where did it come from?</text>
  <rect x="90" y="405" width="245" height="92" class="green"/><text x="212" y="440" text-anchor="middle" class="t">Validation</text><text x="212" y="470" text-anchor="middle" class="s">what evidence supports it?</text>
  <rect x="865" y="105" width="245" height="92" class="amber"/><text x="987" y="140" text-anchor="middle" class="t">Authority</text><text x="987" y="170" text-anchor="middle" class="s">who may observe or act?</text>
  <rect x="865" y="255" width="245" height="92" class="box"/><text x="987" y="290" text-anchor="middle" class="t">Freshness</text><text x="987" y="320" text-anchor="middle" class="s">is the observation current enough?</text>
  <rect x="865" y="405" width="245" height="92" class="box"/><text x="987" y="440" text-anchor="middle" class="t">Confidence</text><text x="987" y="470" text-anchor="middle" class="s">method-specific uncertainty</text>
  <path d="M335 151 H430 V255" class="line"/><path d="M335 301 H430" class="line"/><path d="M335 451 H430 V355" class="line"/><path d="M865 151 H770 V255" class="line"/><path d="M865 301 H770" class="line"/><path d="M865 451 H770 V355" class="line"/>
  <text x="600" y="555" text-anchor="middle" class="t">Do not collapse these into trusted = true.</text>
</svg>