<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Validation evidence and promotion policy</title>
  <desc id="desc">Validators run against an exact candidate snapshot and configuration, producing structured evidence. Promotion policy decides whether the evidence and any approvals are sufficient. If the candidate changes, old evidence cannot silently validate the new snapshot.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.h{font:700 28px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}.t{font:600 20px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}.s{font:400 17px system-ui,-apple-system,Segoe UI,sans-serif;fill:#334155}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:14}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14}.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:2;rx:14}.amber{fill:#fffbeb;stroke:#d97706;stroke-width:2;rx:14}.red{fill:#fef2f2;stroke:#dc2626;stroke-width:2;rx:14}.purple{fill:#faf5ff;stroke:#9333ea;stroke-width:2;rx:14}.line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}</style></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="55" class="h">Validation is evidence about exact inputs; promotion is a policy decision</text>
  <rect x="70" y="120" width="230" height="105" class="amber"/><text x="185" y="157" text-anchor="middle" class="t">Candidate snapshot S2</text><text x="185" y="187" text-anchor="middle" class="s">derived from base S1</text>
  <rect x="380" y="90" width="215" height="80" class="blue"/><text x="487" y="124" text-anchor="middle" class="t">Compiler</text><text x="487" y="150" text-anchor="middle" class="s">config C</text>
  <rect x="380" y="200" width="215" height="80" class="blue"/><text x="487" y="234" text-anchor="middle" class="t">Tests</text><text x="487" y="260" text-anchor="middle" class="s">selection T</text>
  <path d="M300 170 H350 V130 H380" class="line"/><path d="M300 175 H350 V240 H380" class="line"/>
  <rect x="665" y="120" width="245" height="135" class="green"/><text x="787" y="157" text-anchor="middle" class="t">Validation evidence</text><text x="787" y="188" text-anchor="middle" class="s">subject: S2</text><text x="787" y="215" text-anchor="middle" class="s">validator + config + dependencies</text><text x="787" y="242" text-anchor="middle" class="s">result: pass / fail</text>
  <path d="M595 130 H665" class="line"/><path d="M595 240 H665" class="line"/>
  <rect x="970" y="120" width="180" height="135" class="purple"/><text x="1060" y="157" text-anchor="middle" class="t">Policy</text><text x="1060" y="188" text-anchor="middle" class="s">required evidence</text><text x="1060" y="215" text-anchor="middle" class="s">+ approval rules</text><path d="M910 187 H970" class="line"/>
  <rect x="815" y="380" width="260" height="110" class="green"/><text x="945" y="417" text-anchor="middle" class="t">Promote S2</text><text x="945" y="447" text-anchor="middle" class="s">new canonical root</text><path d="M1060 255 V330 H945 V380" class="line"/>
  <rect x="215" y="375" width="360" height="130" class="red"/><text x="395" y="412" text-anchor="middle" class="t">Candidate changed to S3?</text><text x="395" y="442" text-anchor="middle" class="s">S2 evidence does not silently validate S3.</text><text x="395" y="470" text-anchor="middle" class="s">Revalidate or prove dependencies unchanged.</text><path d="M787 255 V330 H395 V375" class="dash"/>
</svg>