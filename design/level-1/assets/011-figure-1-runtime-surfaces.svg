<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Shared runtime platform with multiple product surfaces</title><desc id="desc">Reusable knowledge and domain libraries feed shared application operations. Embedded clients call operations directly; a stable protocol serves server and remote clients; the agent runtime uses constrained tools over the same operations. CLI, TUI, web, API clients, and agents are peer consumers rather than separate implementations.</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  <style>
    .title{font:700 30px system-ui,sans-serif;fill:#0f172a}.subtitle{font:600 17px system-ui,sans-serif;fill:#475569}.label{font:700 20px system-ui,sans-serif;fill:#0f172a}.body{font:16px system-ui,sans-serif;fill:#334155}.small{font:14px system-ui,sans-serif;fill:#475569}.tiny{font:13px system-ui,sans-serif;fill:#64748b}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}.blue{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrowBlue)}
  </style>
</defs><rect width="1200" height="720" fill="#ffffff"/>
<text x="600" y="48" text-anchor="middle" class="title">One platform, multiple product surfaces</text>
<text x="600" y="78" text-anchor="middle" class="subtitle">Business meaning lives below the surfaces; presentation and transport live above it.</text>
<rect x="330" y="115" width="540" height="90" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="600" y="153" text-anchor="middle" class="label">Reusable knowledge + domain libraries</text><text x="600" y="181" text-anchor="middle" class="body">storage · graph · query · migration · projections · domains</text>
<path d="M600 205 L600 250" class="blue"/>
<rect x="330" y="250" width="540" height="90" rx="18" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/><text x="600" y="288" text-anchor="middle" class="label">Application operations</text><text x="600" y="316" text-anchor="middle" class="body">inspect · query · diff · branch · apply · validate · session</text>
<path d="M455 340 C390 385 330 400 250 425" class="line"/><path d="M600 340 L600 425" class="line"/><path d="M745 340 C810 385 870 400 950 425" class="line"/>
<rect x="75" y="425" width="350" height="95" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="250" y="463" text-anchor="middle" class="label">Embedded consumers</text><text x="250" y="491" text-anchor="middle" class="body">Rust app · CLI · local TUI · tests</text>
<rect x="425" y="425" width="350" height="95" rx="16" fill="#f8fafc" stroke="#475569" stroke-width="3"/><text x="600" y="463" text-anchor="middle" class="label">Stable protocol + server</text><text x="600" y="491" text-anchor="middle" class="body">transport · auth · events · cancellation</text>
<rect x="775" y="425" width="350" height="95" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><text x="950" y="463" text-anchor="middle" class="label">Agent adapter</text><text x="950" y="491" text-anchor="middle" class="body">tools · context · capabilities · sessions</text>
<path d="M600 520 L600 575" class="line"/><path d="M950 520 L950 575" class="line"/>
<rect x="405" y="575" width="390" height="90" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/><text x="600" y="611" text-anchor="middle" class="label">Remote clients</text><text x="600" y="639" text-anchor="middle" class="body">web · desktop · external IDE · API integrations</text>
<rect x="800" y="575" width="300" height="90" rx="16" fill="#faf5ff" stroke="#9333ea" stroke-width="3"/><text x="950" y="611" text-anchor="middle" class="label">Agent runtime</text><text x="950" y="639" text-anchor="middle" class="body">model execution over public semantics</text>
</svg>