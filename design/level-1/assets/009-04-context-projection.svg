<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Session context is a projection</title>
  <desc id="desc">A central Session Graph combines with Project Knowledge, Current Selection, Capabilities, and a Context Policy. A context renderer produces an Agent Context. The same Session Graph can also render a Human Transcript, an Audit View, a Decision View, or a Branch Tree. None of these projections is the source of truth.</desc>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#111827">Context is rendered from knowledge, not stored as the session</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/></marker></defs>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="455" y="110" width="290" height="95" rx="18" fill="#e8f1ff" stroke="#2457a7" stroke-width="3"/>
    <text x="600" y="150" font-size="24" font-weight="700" fill="#163b72">Session Graph</text>
    <text x="600" y="178" font-size="16" fill="#163b72">goals · branches · decisions · results</text>

    <rect x="65" y="255" width="205" height="78" rx="14" fill="#f7fafc" stroke="#4b5563" stroke-width="2"/>
    <text x="168" y="289" font-size="18" font-weight="700" fill="#111827">Project Knowledge</text>
    <text x="168" y="313" font-size="14" fill="#374151">objects + exact revisions</text>

    <rect x="300" y="255" width="190" height="78" rx="14" fill="#f7fafc" stroke="#4b5563" stroke-width="2"/>
    <text x="395" y="289" font-size="18" font-weight="700" fill="#111827">Selection</text>
    <text x="395" y="313" font-size="14" fill="#374151">current semantic scope</text>

    <rect x="520" y="255" width="180" height="78" rx="14" fill="#f7fafc" stroke="#4b5563" stroke-width="2"/>
    <text x="610" y="289" font-size="18" font-weight="700" fill="#111827">Capabilities</text>
    <text x="610" y="313" font-size="14" fill="#374151">allowed operations</text>

    <rect x="730" y="255" width="190" height="78" rx="14" fill="#f7fafc" stroke="#4b5563" stroke-width="2"/>
    <text x="825" y="289" font-size="18" font-weight="700" fill="#111827">Context Policy</text>
    <text x="825" y="313" font-size="14" fill="#374151">include · omit · summarize</text>

    <rect x="420" y="400" width="360" height="90" rx="18" fill="#eefbf3" stroke="#24834c" stroke-width="3"/>
    <text x="600" y="439" font-size="22" font-weight="700" fill="#135c33">Context Renderer</text>
    <text x="600" y="466" font-size="15" fill="#135c33">preserves handles, provenance, and scope</text>

    <rect x="450" y="565" width="300" height="86" rx="18" fill="#fff7ed" stroke="#c56a16" stroke-width="3"/>
    <text x="600" y="603" font-size="23" font-weight="700" fill="#7c3f0c">Agent Context</text>
    <text x="600" y="631" font-size="15" fill="#7c3f0c">compact view for this invocation</text>

    <rect x="880" y="420" width="245" height="58" rx="13" fill="#f3f0ff" stroke="#6b4cc2" stroke-width="2"/>
    <text x="1002" y="456" font-size="17" font-weight="700" fill="#4d3591">Human Transcript</text>
    <rect x="880" y="495" width="245" height="58" rx="13" fill="#f3f0ff" stroke="#6b4cc2" stroke-width="2"/>
    <text x="1002" y="531" font-size="17" font-weight="700" fill="#4d3591">Audit View</text>
    <rect x="880" y="570" width="245" height="58" rx="13" fill="#f3f0ff" stroke="#6b4cc2" stroke-width="2"/>
    <text x="1002" y="606" font-size="17" font-weight="700" fill="#4d3591">Decision / Branch Views</text>
  </g>

  <g stroke="#6b7280" stroke-width="2.3" fill="none" marker-end="url(#arrow)">
    <path d="M600 205 L600 255"/>
    <path d="M168 333 C210 385 350 407 420 430"/>
    <path d="M395 333 L500 400"/>
    <path d="M610 333 L610 400"/>
    <path d="M825 333 L700 400"/>
    <path d="M600 490 L600 565"/>
    <path d="M745 160 C965 180 1030 300 1002 420"/>
    <path d="M745 165 C1010 220 1060 390 1002 495"/>
    <path d="M745 170 C1040 260 1080 470 1002 570"/>
  </g>
  <text x="1015" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#4b5563">other projections of the same graph</text>
</svg>
