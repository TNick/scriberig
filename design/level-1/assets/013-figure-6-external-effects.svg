<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">External side effect lifecycle</title>
  <desc id="desc">An external mutation begins as intent, passes local validation and destination-aware capability or approval checks, executes remotely, records a receipt, and is then reconciled back into local semantic state. The system tracks partial and uncertain states instead of pretending the external service participates in a local transaction.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.h{font:700 28px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}.t{font:600 20px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}.s{font:400 17px system-ui,-apple-system,Segoe UI,sans-serif;fill:#334155}.tiny{font:400 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#475569}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:14}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14}.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:2;rx:14}.amber{fill:#fffbeb;stroke:#d97706;stroke-width:2;rx:14}.purple{fill:#faf5ff;stroke:#9333ea;stroke-width:2;rx:14}.line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="55" class="h">External side effects require intent, receipt, and reconciliation</text>
  <rect x="65" y="115" width="175" height="95" class="amber"/><text x="152" y="150" text-anchor="middle" class="t">Intent</text><text x="152" y="180" text-anchor="middle" class="s">desired external change</text>
  <rect x="295" y="115" width="185" height="95" class="green"/><text x="387" y="150" text-anchor="middle" class="t">Pre-validation</text><text x="387" y="180" text-anchor="middle" class="s">local candidate + diff</text>
  <rect x="535" y="115" width="195" height="95" class="amber"/><text x="632" y="150" text-anchor="middle" class="t">Capability / approval</text><text x="632" y="180" text-anchor="middle" class="s">destination-aware</text>
  <rect x="785" y="115" width="180" height="95" class="purple"/><text x="875" y="150" text-anchor="middle" class="t">External action</text><text x="875" y="180" text-anchor="middle" class="s">push • send • publish</text>
  <rect x="1020" y="115" width="140" height="95" class="blue"/><text x="1090" y="150" text-anchor="middle" class="t">Receipt</text><text x="1090" y="180" text-anchor="middle" class="s">remote evidence</text>
  <path d="M240 162 H295" class="line"/><path d="M480 162 H535" class="line"/><path d="M730 162 H785" class="line"/><path d="M965 162 H1020" class="line"/>
  <rect x="425" y="340" width="350" height="120" class="green"/><text x="600" y="377" text-anchor="middle" class="t">Local reconciliation</text><text x="600" y="407" text-anchor="middle" class="s">observe remote state and update knowledge</text><text x="600" y="435" text-anchor="middle" class="s">without pretending remote + local are atomic</text>
  <path d="M1090 210 V290 H775 V340" class="line"/>
  <rect x="165" y="525" width="870" height="70" class="box"/><text x="600" y="555" text-anchor="middle" class="t">requested → attempted → confirmed externally → reflected locally</text><text x="600" y="580" text-anchor="middle" class="tiny">failure or uncertainty remains visible so retries can be safe and idempotent where possible</text>
</svg>