<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Transitive dependency reuse after one function changes</title>
  <desc id="desc">Two side-by-side dependency graphs show three function revisions feeding three function summaries and then one module summary. Before the edit, F2 at revision B feeds summary FB and module summary M1. After F2 changes to revision D, summaries FA and FC are reused, only the middle summary becomes FD, and only the module summary is recomputed as M2.</desc>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#111827">Derived structural sharing limits recomputation to affected paths</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/></marker>
  </defs>

  <text x="300" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#374151">Before</text>
  <rect x="45" y="115" width="510" height="510" rx="18" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
  <g font-family="system-ui, sans-serif">
    <rect x="85" y="165" width="125" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="147" y="201" text-anchor="middle" font-size="16" font-weight="700">F1@A</text>
    <rect x="85" y="300" width="125" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="147" y="336" text-anchor="middle" font-size="16" font-weight="700">F2@B</text>
    <rect x="85" y="435" width="125" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="147" y="471" text-anchor="middle" font-size="16" font-weight="700">F3@C</text>

    <rect x="265" y="165" width="145" height="60" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="337" y="201" text-anchor="middle" font-size="16" font-weight="700">Summary FA</text>
    <rect x="265" y="300" width="145" height="60" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="337" y="336" text-anchor="middle" font-size="16" font-weight="700">Summary FB</text>
    <rect x="265" y="435" width="145" height="60" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="337" y="471" text-anchor="middle" font-size="16" font-weight="700">Summary FC</text>

    <rect x="430" y="300" width="95" height="60" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="477" y="326" text-anchor="middle" font-size="14" font-weight="700">Module</text><text x="477" y="346" text-anchor="middle" font-size="14" font-weight="700">M1</text>
  </g>
  <path d="M210 195 L265 195" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/><path d="M210 330 L265 330" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/><path d="M210 465 L265 465" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M410 195 C445 195 440 295 430 315" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/><path d="M410 330 L430 330" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/><path d="M410 465 C445 465 440 365 430 345" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="900" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#374151">After F2 changes</text>
  <rect x="645" y="115" width="510" height="510" rx="18" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
  <g font-family="system-ui, sans-serif">
    <rect x="685" y="165" width="125" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="747" y="201" text-anchor="middle" font-size="16" font-weight="700">F1@A</text>
    <rect x="685" y="300" width="125" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="747" y="326" text-anchor="middle" font-size="16" font-weight="700">F2@D</text><text x="747" y="347" text-anchor="middle" font-size="12" fill="#991b1b">changed</text>
    <rect x="685" y="435" width="125" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="747" y="471" text-anchor="middle" font-size="16" font-weight="700">F3@C</text>

    <rect x="865" y="165" width="145" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="937" y="193" text-anchor="middle" font-size="16" font-weight="700">Summary FA</text><text x="937" y="214" text-anchor="middle" font-size="12" fill="#166534">reused</text>
    <rect x="865" y="300" width="145" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="937" y="328" text-anchor="middle" font-size="16" font-weight="700">Summary FD</text><text x="937" y="349" text-anchor="middle" font-size="12" fill="#92400e">computed</text>
    <rect x="865" y="435" width="145" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="937" y="463" text-anchor="middle" font-size="16" font-weight="700">Summary FC</text><text x="937" y="484" text-anchor="middle" font-size="12" fill="#166534">reused</text>

    <rect x="1030" y="300" width="95" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="1077" y="326" text-anchor="middle" font-size="14" font-weight="700">Module</text><text x="1077" y="346" text-anchor="middle" font-size="14" font-weight="700">M2</text>
  </g>
  <path d="M810 195 L865 195" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/><path d="M810 330 L865 330" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/><path d="M810 465 L865 465" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1010 195 C1045 195 1040 295 1030 315" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/><path d="M1010 330 L1030 330" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/><path d="M1010 465 C1045 465 1040 365 1030 345" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="600" y="674" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#166534">Unchanged semantic inputs preserve their derived results; only the affected path is rebuilt.</text>
</svg>