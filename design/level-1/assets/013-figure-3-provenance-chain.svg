<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Provenance chain from original evidence to accepted decision</title>
  <desc id="desc">Original evidence is captured with coordinates, parsed by an adapter, and may produce derived knowledge such as a summary. A decision candidate can cite that chain. Acceptance adds new provenance but does not erase the source or the transformations.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.h{font:700 28px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}.t{font:600 20px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}.s{font:400 17px system-ui,-apple-system,Segoe UI,sans-serif;fill:#334155}.tiny{font:400 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#475569}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:14}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14}.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:2;rx:14}.amber{fill:#fffbeb;stroke:#d97706;stroke-width:2;rx:14}.purple{fill:#faf5ff;stroke:#9333ea;stroke-width:2;rx:14}.line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}</style></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="55" class="h">Provenance keeps original evidence distinct from interpretation</text>
  <rect x="60" y="120" width="190" height="95" class="box"/><text x="155" y="155" text-anchor="middle" class="t">Original evidence</text><text x="155" y="185" text-anchor="middle" class="s">PDF / file / response</text>
  <rect x="315" y="120" width="190" height="95" class="blue"/><text x="410" y="155" text-anchor="middle" class="t">Captured object</text><text x="410" y="185" text-anchor="middle" class="s">source coordinates + time</text>
  <rect x="570" y="120" width="190" height="95" class="purple"/><text x="665" y="155" text-anchor="middle" class="t">Parsed structure</text><text x="665" y="185" text-anchor="middle" class="s">adapter + version</text>
  <rect x="825" y="120" width="190" height="95" class="purple"/><text x="920" y="155" text-anchor="middle" class="t">Derived knowledge</text><text x="920" y="185" text-anchor="middle" class="s">summary / classification</text>
  <path d="M250 167 H315" class="line"/><path d="M505 167 H570" class="line"/><path d="M760 167 H825" class="line"/>
  <rect x="825" y="330" width="250" height="105" class="amber"/><text x="950" y="365" text-anchor="middle" class="t">Decision candidate</text><text x="950" y="394" text-anchor="middle" class="s">supported by derived + original evidence</text>
  <rect x="475" y="330" width="250" height="105" class="green"/><text x="600" y="365" text-anchor="middle" class="t">Accepted decision</text><text x="600" y="394" text-anchor="middle" class="s">promotion adds acceptance provenance</text>
  <path d="M920 215 V330" class="line"/><path d="M825 382 H725" class="line"/>
  <path d="M600 330 C600 270,410 270,410 215" class="dash"/><text x="505" y="270" text-anchor="middle" class="tiny">traceable to captured evidence</text>
  <rect x="90" y="500" width="1020" height="80" class="box"/><text x="600" y="532" text-anchor="middle" class="t">Every transformation is inspectable.</text><text x="600" y="560" text-anchor="middle" class="s">A model summary never becomes indistinguishable from the source material it summarizes.</text>
</svg>