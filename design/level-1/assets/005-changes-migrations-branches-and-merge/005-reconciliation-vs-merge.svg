<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">External projection reconciliation feeds semantic merge but is not the same operation</title>
<desc id="desc">A canonical base snapshot B renders a file projection. The user edits that file, which is parsed into semantic candidate F. Meanwhile the database may advance to semantic state D. Reconciliation is responsible for inferring semantic correspondence from the edited representation; semantic merge then combines base B, database state D, and candidate F to create a new semantic result before rendering again.</desc>
<style>.title{font:700 34px Arial,sans-serif;fill:#1f2937}.subtitle{font:400 18px Arial,sans-serif;fill:#4b5563}.boxTitle{font:700 20px Arial,sans-serif;fill:#111827}.body{font:400 16px Arial,sans-serif;fill:#374151}.small{font:400 14px Arial,sans-serif;fill:#6b7280}.label{font:700 15px Arial,sans-serif;fill:#0369a1}</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#64748b"/></marker></defs>
<rect width="1200" height="720" fill="#fff"/>
<text x="60" y="58" class="title">Reconciliation infers intent; merge combines semantic descendants</text>
<text x="60" y="90" class="subtitle">External files are editable projections, but canonical conflict resolution remains semantic.</text>

<rect x="70" y="150" width="230" height="90" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="125" y="187" class="boxTitle">Base B</text><text x="100" y="216" class="body">canonical snapshot used to render</text>
<rect x="385" y="145" width="235" height="100" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="435" y="183" class="boxTitle">File projection</text><text x="415" y="212" class="body">Markdown / source / other view</text>
<rect x="720" y="145" width="235" height="100" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="775" y="183" class="boxTitle">Edited file</text><text x="752" y="212" class="body">human changes representation</text>
<line x1="300" y1="195" x2="375" y2="195" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="178" class="label">render</text>
<line x1="620" y1="195" x2="710" y2="195" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="650" y="178" class="label">edit</text>

<rect x="720" y="330" width="235" height="100" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="775" y="368" class="boxTitle">Candidate F</text><text x="750" y="397" class="body">parsed semantic state</text>
<line x1="837" y1="245" x2="837" y2="320" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><text x="850" y="286" class="label">parse + reconcile identity</text>

<rect x="70" y="330" width="230" height="100" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="127" y="368" class="boxTitle">Current D</text><text x="100" y="397" class="body">database may have changed too</text>
<line x1="185" y1="240" x2="185" y2="320" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="200" y="285" class="small">concurrent canonical work</text>

<rect x="405" y="480" width="390" height="120" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="3"/><text x="505" y="520" class="boxTitle">Semantic three-way merge</text><text x="470" y="552" class="body">base = B · left = D · right = F</text><text x="446" y="580" class="small">combine semantic changes, not rendered bytes</text>
<line x1="230" y1="430" x2="475" y2="472" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><line x1="780" y1="430" x2="725" y2="472" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><line x1="300" y1="195" x2="395" y2="500" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>

<rect x="875" y="500" width="250" height="80" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="935" y="534" class="boxTitle">New semantic state</text><text x="925" y="562" class="body">then render projections again</text>
<line x1="795" y1="540" x2="865" y2="540" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="70" y="660" class="body">Reconciliation has one extra duty that ordinary merge does not: determining what semantic objects an externally edited representation refers to.</text>
</svg>