<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Three-way semantic merge compares left and right changes against a common base</title>
<desc id="desc">Base snapshot S1 branches into left snapshot S2 and right snapshot S3. The merge computes left and right semantic changes relative to S1. Disjoint changes combine automatically, same-entity changes are inspected more deeply, and unresolved ambiguity becomes a structured semantic conflict. Successful resolutions produce new snapshot S4 without mutating S1, S2, or S3.</desc>
<style>.title{font:700 34px Arial,sans-serif;fill:#1f2937}.subtitle{font:400 18px Arial,sans-serif;fill:#4b5563}.boxTitle{font:700 20px Arial,sans-serif;fill:#111827}.body{font:400 16px Arial,sans-serif;fill:#374151}.small{font:400 14px Arial,sans-serif;fill:#6b7280}.good{font:700 15px Arial,sans-serif;fill:#166534}.warn{font:700 15px Arial,sans-serif;fill:#9a3412}.bad{font:700 15px Arial,sans-serif;fill:#991b1b}</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#64748b"/></marker></defs>
<rect width="1200" height="720" fill="#fff"/>
<text x="60" y="58" class="title">Three-way merge reasons from a common base</text>
<text x="60" y="90" class="subtitle">Conflict is delayed until the smallest semantic scope that cannot be resolved safely.</text>

<rect x="475" y="130" width="250" height="86" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="548" y="166" class="boxTitle">Base S1</text><text x="525" y="194" class="body">common ancestor</text>
<rect x="180" y="285" width="250" height="96" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="257" y="323" class="boxTitle">Left S2</text><text x="215" y="352" class="body">diff(S1, S2)</text>
<rect x="770" y="285" width="250" height="96" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="842" y="323" class="boxTitle">Right S3</text><text x="802" y="352" class="body">diff(S1, S3)</text>
<line x1="520" y1="216" x2="390" y2="275" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><line x1="680" y1="216" x2="810" y2="275" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="205" y="455" width="790" height="120" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="235" y="490" class="boxTitle">Semantic merge analysis</text>
<text x="235" y="522" class="good">1. Disjoint entity changes → combine automatically</text>
<text x="235" y="550" class="warn">2. Same entity → inspect fields, relations, collections, then domain semantics</text>
<text x="235" y="578" class="bad">3. Ambiguous intent → emit a structured conflict; do not silently choose</text>
<line x1="305" y1="381" x2="430" y2="445" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><line x1="895" y1="381" x2="770" y2="445" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="410" y="620" width="380" height="70" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="515" y="650" class="boxTitle">Merged S4</text><text x="455" y="677" class="body">new immutable snapshot + merge provenance</text>
<line x1="600" y1="575" x2="600" y2="610" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
</svg>