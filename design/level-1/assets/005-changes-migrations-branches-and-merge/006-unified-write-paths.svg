<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">All Scriberig write surfaces converge on one semantic change pipeline</title>
<desc id="desc">User actions from the web editor, CLI, API, TUI, external file reconciliation, agents, importers, and refactoring tools all feed one semantic change proposal path. The proposal creates immutable revisions and a candidate snapshot, records a migration and provenance, optionally validates the result, and only then atomically promotes a named root. No interface has a hidden direct mutation path.</desc>
<style>.title{font:700 34px Arial,sans-serif;fill:#1f2937}.subtitle{font:400 18px Arial,sans-serif;fill:#4b5563}.boxTitle{font:700 19px Arial,sans-serif;fill:#111827}.body{font:400 15px Arial,sans-serif;fill:#374151}.small{font:400 14px Arial,sans-serif;fill:#6b7280}.source{font:600 16px Arial,sans-serif;fill:#111827}</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#64748b"/></marker></defs>
<rect width="1200" height="720" fill="#fff"/>
<text x="60" y="58" class="title">One write model across every product surface</text>
<text x="60" y="90" class="subtitle">Interfaces differ; canonical mutation semantics do not.</text>

<rect x="55" y="145" width="210" height="58" rx="12" fill="#f8fafc" stroke="#94a3b8"/><text x="105" y="181" class="source">Web editor</text>
<rect x="55" y="220" width="210" height="58" rx="12" fill="#f8fafc" stroke="#94a3b8"/><text x="120" y="256" class="source">CLI / TUI</text>
<rect x="55" y="295" width="210" height="58" rx="12" fill="#f8fafc" stroke="#94a3b8"/><text x="115" y="331" class="source">API client</text>
<rect x="55" y="370" width="210" height="58" rx="12" fill="#f8fafc" stroke="#94a3b8"/><text x="120" y="406" class="source">Agent</text>
<rect x="55" y="445" width="210" height="58" rx="12" fill="#f8fafc" stroke="#94a3b8"/><text x="85" y="481" class="source">External projection</text>
<rect x="55" y="520" width="210" height="58" rx="12" fill="#f8fafc" stroke="#94a3b8"/><text x="95" y="556" class="source">Importer / refactor</text>

<rect x="350" y="255" width="235" height="190" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="397" y="295" class="boxTitle">Semantic change</text><text x="385" y="329" class="body">interpret requested operation</text><text x="385" y="358" class="body">create new revisions</text><text x="385" y="387" class="body">create candidate snapshot</text><text x="385" y="416" class="body">record provenance</text>
<line x1="265" y1="174" x2="340" y2="300" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><line x1="265" y1="249" x2="340" y2="320" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><line x1="265" y1="324" x2="340" y2="340" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><line x1="265" y1="399" x2="340" y2="360" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><line x1="265" y1="474" x2="340" y2="380" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><line x1="265" y1="549" x2="340" y2="400" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="660" y="190" width="220" height="105" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="712" y="229" class="boxTitle">Migration</text><text x="694" y="259" class="body">base + result + meaning</text><text x="690" y="283" class="small">explicit historical edge</text>
<rect x="660" y="340" width="220" height="105" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="707" y="379" class="boxTitle">Validation</text><text x="692" y="409" class="body">schema / tests / policy</text><text x="700" y="433" class="small">separate from change itself</text>
<line x1="585" y1="320" x2="650" y2="250" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><line x1="585" y1="385" x2="650" y2="395" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="960" y="265" width="190" height="150" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1005" y="305" class="boxTitle">Promotion</text><text x="986" y="338" class="body">compare expected root</text><text x="992" y="367" class="body">atomically advance</text><text x="994" y="396" class="small">or report concurrency</text>
<line x1="880" y1="245" x2="950" y2="315" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><line x1="880" y1="395" x2="950" y2="365" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="350" y="560" width="800" height="88" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="750" y="594" text-anchor="middle" class="body">A browser edit and an agent edit differ in provenance and interaction, not in the canonical commit model.</text><text x="750" y="622" text-anchor="middle" class="body">This is what makes history, merge, validation, and audit behavior consistent across the ecosystem.</text>
</svg>