<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">One authoritative wire contract feeds multiple language clients</title><desc id="desc">An authoritative protocol contract sits at the center. It defines identifiers, errors, operations, events, queries, migrations, and compatibility metadata. Rust protocol types, TypeScript types and clients, and future language clients are generated from or checked against that one contract. The server adapts application operations to the same contract.</desc><defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  <style>
    .title{font:700 30px system-ui,sans-serif;fill:#0f172a}.subtitle{font:600 17px system-ui,sans-serif;fill:#475569}.label{font:700 20px system-ui,sans-serif;fill:#0f172a}.body{font:16px system-ui,sans-serif;fill:#334155}.small{font:14px system-ui,sans-serif;fill:#475569}.tiny{font:13px system-ui,sans-serif;fill:#64748b}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}.blue{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arrowBlue)}
  </style>
</defs><rect width="1200" height="660" fill="#ffffff"/>
<text x="600" y="48" text-anchor="middle" class="title">One wire contract, many implementations</text><text x="600" y="78" text-anchor="middle" class="subtitle">Language bindings may differ; semantic contracts must not drift.</text>
<rect x="375" y="125" width="450" height="150" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="600" y="166" text-anchor="middle" class="label">Authoritative protocol contract</text><text x="600" y="199" text-anchor="middle" class="body">IDs · references · errors · operations · events</text><text x="600" y="228" text-anchor="middle" class="body">queries · migrations · compatibility metadata</text><text x="600" y="254" text-anchor="middle" class="small">one definition or one generation path</text>
<rect x="70" y="365" width="285" height="105" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="212" y="407" text-anchor="middle" class="label">Rust protocol types</text><text x="212" y="440" text-anchor="middle" class="small">server + Rust client</text>
<rect x="458" y="365" width="285" height="105" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/><text x="600" y="407" text-anchor="middle" class="label">TypeScript contract</text><text x="600" y="440" text-anchor="middle" class="small">browser + desktop clients</text>
<rect x="845" y="365" width="285" height="105" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/><text x="987" y="407" text-anchor="middle" class="label">Future clients</text><text x="987" y="440" text-anchor="middle" class="small">other languages / SDKs</text>
<path d="M485 275 C420 315 330 330 245 365" class="line"/><path d="M600 275 L600 365" class="line"/><path d="M715 275 C780 315 870 330 955 365" class="line"/>
<rect x="385" y="535" width="430" height="80" rx="16" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/><text x="600" y="568" text-anchor="middle" class="label">Application operations ↔ server adapter</text><text x="600" y="595" text-anchor="middle" class="small">transport exposes the contract; it does not redefine semantics</text>
<path d="M600 535 L600 476" class="dash"/>
</svg>