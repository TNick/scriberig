<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Agent edits flow through semantic migration and validation</title>
  <desc id="desc">A base snapshot feeds a scoped agent branch and optional speculative workspace. The branch produces a semantic migration proposal. Validation either rejects it and returns the branch to further work, or accepts it for explicit promotion, producing a new result snapshot. The agent never writes directly to canonical state.</desc>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#111827">Agent edits use the same semantic change pipeline as other clients</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/></marker></defs>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="70" y="155" width="205" height="90" rx="17" fill="#e8f1ff" stroke="#2457a7" stroke-width="3"/>
    <text x="173" y="194" font-size="21" font-weight="700" fill="#163b72">Base Snapshot S1</text>
    <text x="173" y="222" font-size="15" fill="#163b72">known canonical state</text>

    <rect x="335" y="125" width="240" height="150" rx="18" fill="#eefbf3" stroke="#24834c" stroke-width="3"/>
    <text x="455" y="164" font-size="22" font-weight="700" fill="#135c33">Agent Branch B</text>
    <text x="455" y="194" font-size="15" fill="#135c33">purpose + capabilities</text>
    <text x="455" y="217" font-size="15" fill="#135c33">semantic inspection</text>
    <text x="455" y="240" font-size="15" fill="#135c33">optional workspace candidates</text>

    <rect x="635" y="155" width="225" height="90" rx="17" fill="#fdf2f8" stroke="#a43c73" stroke-width="3"/>
    <text x="748" y="194" font-size="20" font-weight="700" fill="#7a2854">Migration Proposal</text>
    <text x="748" y="222" font-size="15" fill="#7a2854">semantic operations against S1</text>

    <rect x="925" y="155" width="205" height="90" rx="17" fill="#fff7ed" stroke="#c56a16" stroke-width="3"/>
    <text x="1028" y="194" font-size="22" font-weight="700" fill="#7c3f0c">Validation</text>
    <text x="1028" y="222" font-size="15" fill="#7c3f0c">checks · tests · policy</text>

    <rect x="760" y="410" width="220" height="90" rx="17" fill="#f3f0ff" stroke="#6b4cc2" stroke-width="3"/>
    <text x="870" y="449" font-size="22" font-weight="700" fill="#4d3591">Promotion</text>
    <text x="870" y="477" font-size="15" fill="#4d3591">explicit accepted transition</text>

    <rect x="455" y="410" width="220" height="90" rx="17" fill="#e8f1ff" stroke="#2457a7" stroke-width="3"/>
    <text x="565" y="449" font-size="21" font-weight="700" fill="#163b72">Result Snapshot S2</text>
    <text x="565" y="477" font-size="15" fill="#163b72">new canonical state</text>

    <rect x="920" y="560" width="220" height="78" rx="15" fill="#fff1f2" stroke="#b74444" stroke-width="2"/>
    <text x="1030" y="594" font-size="19" font-weight="700" fill="#842f2f">Rejected</text>
    <text x="1030" y="620" font-size="15" fill="#842f2f">revise, retry, or abandon</text>
  </g>

  <g stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M275 200 L335 200"/>
    <path d="M575 200 L635 200"/>
    <path d="M860 200 L925 200"/>
    <path d="M1028 245 C1030 330 950 370 900 410"/>
    <path d="M760 455 L675 455"/>
    <path d="M1028 245 L1030 560"/>
    <path d="M920 599 C720 635 480 615 455 275"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">
    <text x="964" y="345">accepted</text>
    <text x="1048" y="400">rejected</text>
    <text x="700" y="444">commit</text>
    <text x="635" y="615">failure returns to branch, not canonical state</text>
  </g>

  <line x1="70" y1="335" x2="1130" y2="335" stroke="#d1d5db" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="85" y="325" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">speculative / proposed work</text>
  <text x="85" y="360" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">accepted canonical transition below this boundary</text>
</svg>
