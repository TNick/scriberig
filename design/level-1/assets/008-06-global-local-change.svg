<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Global snapshot change and local cache validity are complementary</title>
  <desc id="desc">Before and after panels show Snapshot S1 becoming Snapshot S2 because Function G changes from revision GR1 to GR2 while Function F stays at FR1. A function summary depending only on F at FR1 remains reusable, while a project-wide analysis depending on the whole snapshot becomes invalid. The diagram emphasizes global certainty from SnapshotId and local reuse from exact revision dependencies.</desc>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#111827">Global certainty and local reuse solve different problems</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/></marker></defs>

  <g font-family="system-ui, sans-serif">
    <rect x="55" y="100" width="480" height="465" rx="20" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
    <text x="295" y="140" text-anchor="middle" font-size="21" font-weight="700">Before</text>
    <rect x="170" y="165" width="250" height="72" rx="14" fill="#2563eb"/><text x="295" y="208" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Snapshot S1</text>
    <rect x="100" y="280" width="165" height="70" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="182" y="322" text-anchor="middle" font-size="17" font-weight="700">F → FR1</text>
    <rect x="325" y="280" width="165" height="70" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="407" y="322" text-anchor="middle" font-size="17" font-weight="700">G → GR1</text>
    <rect x="100" y="415" width="165" height="82" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="182" y="446" text-anchor="middle" font-size="16" font-weight="700">Summary SF1</text><text x="182" y="470" text-anchor="middle" font-size="13" fill="#4b5563">depends on FR1</text>
    <rect x="325" y="415" width="165" height="82" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="407" y="446" text-anchor="middle" font-size="16" font-weight="700">Project A1</text><text x="407" y="470" text-anchor="middle" font-size="13" fill="#4b5563">depends on S1</text>

    <rect x="665" y="100" width="480" height="465" rx="20" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
    <text x="905" y="140" text-anchor="middle" font-size="21" font-weight="700">After G changes</text>
    <rect x="780" y="165" width="250" height="72" rx="14" fill="#2563eb"/><text x="905" y="208" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Snapshot S2</text>
    <rect x="710" y="280" width="165" height="70" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="792" y="322" text-anchor="middle" font-size="17" font-weight="700">F → FR1</text>
    <rect x="935" y="280" width="165" height="70" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="1017" y="309" text-anchor="middle" font-size="17" font-weight="700">G → GR2</text><text x="1017" y="332" text-anchor="middle" font-size="12" fill="#991b1b">changed</text>
    <rect x="710" y="415" width="165" height="82" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="792" y="446" text-anchor="middle" font-size="16" font-weight="700">Summary SF1</text><text x="792" y="470" text-anchor="middle" font-size="13" fill="#166534">reuse: FR1 unchanged</text>
    <rect x="935" y="415" width="165" height="82" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="1017" y="446" text-anchor="middle" font-size="16" font-weight="700">Project A2</text><text x="1017" y="470" text-anchor="middle" font-size="13" fill="#92400e">recompute: S2 differs</text>
  </g>

  <path d="M420 201 C570 201 630 201 780 201" fill="none" stroke="#4b5563" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="600" y="183" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">any canonical change → new SnapshotId</text>
  <path d="M265 456 C500 580 570 580 710 456" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrow)"/>
  <text x="500" y="590" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#166534">local exact dependency still matches</text>

  <rect x="210" y="620" width="780" height="48" rx="12" fill="#eef2ff" stroke="#6366f1"/>
  <text x="600" y="651" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#3730a3">SnapshotId answers “did anything change?”; RevisionId + dependencies answer “does this result still apply?”</text>
</svg>