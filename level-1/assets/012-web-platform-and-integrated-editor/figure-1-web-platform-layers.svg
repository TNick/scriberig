<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Reusable web platform layers leading to the integrated editor</title>
  <desc id="desc">A vertical architecture diagram starts with the shared Scriberig protocol, then the transport client, client semantic model, headless interaction primitives and React bindings, reusable visual components, optional opinionated component systems such as MUI, and finally the integrated Scriberig editor. Side arrows show that third-party applications may stop at the client, model, headless, React, or component layers without depending on the full editor.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>
      .title{font:700 30px system-ui,sans-serif;fill:#0f172a}.label{font:700 20px system-ui,sans-serif;fill:#0f172a}.body{font:16px system-ui,sans-serif;fill:#334155}.small{font:14px system-ui,sans-serif;fill:#475569}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="46" text-anchor="middle" class="title">Reusable web platform, integrated editor on top</text>

  <rect x="365" y="80" width="470" height="70" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="600" y="112" text-anchor="middle" class="label">Shared Scriberig protocol</text>
  <text x="600" y="137" text-anchor="middle" class="small">entities · snapshots · operations · events</text>

  <rect x="365" y="180" width="470" height="70" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="600" y="212" text-anchor="middle" class="label">Transport client</text>
  <text x="600" y="237" text-anchor="middle" class="small">framework-independent browser / Node access</text>

  <rect x="365" y="280" width="470" height="70" rx="16" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
  <text x="600" y="312" text-anchor="middle" class="label">Client semantic model</text>
  <text x="600" y="337" text-anchor="middle" class="small">snapshot awareness · caches · operations · selection</text>

  <rect x="215" y="390" width="360" height="80" rx="16" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
  <text x="395" y="423" text-anchor="middle" class="label">Headless interaction primitives</text>
  <text x="395" y="449" text-anchor="middle" class="small">tree · commands · navigation · editor behavior</text>

  <rect x="625" y="390" width="360" height="80" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="805" y="423" text-anchor="middle" class="label">React bindings</text>
  <text x="805" y="449" text-anchor="middle" class="small">framework convenience, not canonical semantics</text>

  <rect x="365" y="505" width="470" height="70" rx="16" fill="#f8fafc" stroke="#475569" stroke-width="3"/>
  <text x="600" y="537" text-anchor="middle" class="label">Reusable visual components</text>
  <text x="600" y="562" text-anchor="middle" class="small">object tree · inspector · diff · projection editor</text>

  <rect x="365" y="605" width="470" height="60" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
  <text x="600" y="642" text-anchor="middle" class="label">Opinionated UI packages (for example MUI)</text>

  <rect x="365" y="695" width="470" height="50" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="600" y="727" text-anchor="middle" class="label">Integrated Scriberig editor</text>

  <path d="M600 150 L600 180" class="line"/><path d="M600 250 L600 280" class="line"/>
  <path d="M540 350 C500 370 450 375 420 390" class="line"/><path d="M660 350 C700 370 750 375 780 390" class="line"/>
  <path d="M395 470 C430 490 500 500 545 505" class="line"/><path d="M805 470 C770 490 700 500 655 505" class="line"/>
  <path d="M600 575 L600 605" class="line"/><path d="M600 665 L600 695" class="line"/>

  <rect x="35" y="180" width="250" height="405" rx="20" fill="#fafafa" stroke="#94a3b8" stroke-width="2"/>
  <text x="160" y="215" text-anchor="middle" class="label">Third-party reuse</text>
  <text x="160" y="247" text-anchor="middle" class="body">Consumers may stop at</text>
  <text x="160" y="279" text-anchor="middle" class="body">the lowest useful layer.</text>
  <text x="160" y="330" text-anchor="middle" class="small">custom protocol client</text>
  <text x="160" y="375" text-anchor="middle" class="small">custom semantic application</text>
  <text x="160" y="420" text-anchor="middle" class="small">custom design system</text>
  <text x="160" y="465" text-anchor="middle" class="small">React application</text>
  <text x="160" y="510" text-anchor="middle" class="small">ready-made components</text>
  <path d="M285 215 L365 215" class="dash"/><path d="M285 315 L365 315" class="dash"/><path d="M285 430 L215 430" class="dash"/><path d="M285 540 L365 540" class="dash"/>

  <text x="1040" y="304" text-anchor="middle" class="body">Lower layers never</text>
  <text x="1040" y="330" text-anchor="middle" class="body">depend on MUI or</text>
  <text x="1040" y="356" text-anchor="middle" class="body">the reference editor.</text>
  <path d="M985 365 C930 390 900 470 835 520" class="dash"/>
</svg>