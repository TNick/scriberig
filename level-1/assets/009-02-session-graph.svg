<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">A session is a graph rather than a flat transcript</title>
  <desc id="desc">The diagram shows a session connected to a goal, a branch, a decision, and an open task. Inside the branch, a tool invocation produces a tool result, which supports an observation. The branch touches a project function and produces a migration. The decision is derived from the branch and concerns the same project function. Chronological order is only one set of edges among semantic relations.</desc>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#111827">A session is a semantic graph, not only a log</text>

  <g font-family="system-ui, sans-serif">
    <rect x="470" y="95" width="260" height="80" rx="18" fill="#e8f1ff" stroke="#2457a7" stroke-width="3"/>
    <text x="600" y="145" text-anchor="middle" font-size="25" font-weight="700" fill="#163b72">Session S</text>

    <rect x="80" y="225" width="210" height="74" rx="15" fill="#f7fafc" stroke="#4b5563" stroke-width="2"/>
    <text x="185" y="270" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">Goal G</text>

    <rect x="380" y="225" width="440" height="105" rx="18" fill="#eefbf3" stroke="#24834c" stroke-width="3"/>
    <text x="600" y="264" text-anchor="middle" font-size="22" font-weight="700" fill="#135c33">Branch B1</text>
    <text x="600" y="293" text-anchor="middle" font-size="16" fill="#135c33">“Investigate cache invalidation”</text>

    <rect x="910" y="225" width="210" height="74" rx="15" fill="#f7fafc" stroke="#4b5563" stroke-width="2"/>
    <text x="1015" y="270" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">Open Task Q1</text>

    <rect x="110" y="585" width="240" height="82" rx="15" fill="#fff7ed" stroke="#c56a16" stroke-width="2"/>
    <text x="230" y="620" text-anchor="middle" font-size="20" font-weight="700" fill="#7c3f0c">Project Function F</text>
    <text x="230" y="647" text-anchor="middle" font-size="15" fill="#7c3f0c">exact revision pinned when needed</text>

    <rect x="455" y="585" width="220" height="82" rx="15" fill="#fdf2f8" stroke="#a43c73" stroke-width="2"/>
    <text x="565" y="620" text-anchor="middle" font-size="20" font-weight="700" fill="#7a2854">Migration M</text>
    <text x="565" y="647" text-anchor="middle" font-size="15" fill="#7a2854">canonical state transition</text>

    <rect x="825" y="585" width="250" height="82" rx="15" fill="#f3f0ff" stroke="#6b4cc2" stroke-width="2"/>
    <text x="950" y="620" text-anchor="middle" font-size="20" font-weight="700" fill="#4d3591">Decision D1</text>
    <text x="950" y="647" text-anchor="middle" font-size="15" fill="#4d3591">durable knowledge candidate</text>

    <rect x="390" y="385" width="190" height="70" rx="14" fill="#f7fafc" stroke="#4b5563" stroke-width="2"/>
    <text x="485" y="427" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Tool Invocation I1</text>

    <rect x="615" y="385" width="190" height="70" rx="14" fill="#f7fafc" stroke="#4b5563" stroke-width="2"/>
    <text x="710" y="427" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Tool Result R1</text>

    <rect x="615" y="485" width="190" height="70" rx="14" fill="#f7fafc" stroke="#4b5563" stroke-width="2"/>
    <text x="710" y="527" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Observation O1</text>
  </g>

  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/></marker></defs>
  <g stroke="#6b7280" stroke-width="2.3" fill="none" marker-end="url(#arrow)">
    <path d="M545 175 L240 225"/><path d="M600 175 L600 225"/><path d="M655 175 L960 225"/>
    <path d="M530 330 L485 385"/><path d="M580 420 L615 420"/><path d="M710 455 L710 485"/>
    <path d="M420 330 C300 385 250 455 230 585"/>
    <path d="M600 330 L565 585"/>
    <path d="M780 330 C900 395 945 485 950 585"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">
    <text x="525" y="371">contains</text>
    <text x="590" y="411">produces</text>
    <text x="724" y="478">supports</text>
    <text x="277" y="472">touches</text>
    <text x="572" y="492">produces</text>
    <text x="865" y="478">derived from</text>
  </g>

  <text x="600" y="720" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#374151">Chronology can be rendered from the graph, but semantic edges preserve what each object means and how results relate.</text>
</svg>
