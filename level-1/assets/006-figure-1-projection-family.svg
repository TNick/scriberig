<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">One canonical knowledge state rendered into several projections</title>
  <desc id="desc">A central canonical knowledge box fans out through projection adapters to Markdown, Rust source, a human transcript, agent context, and an interactive browser view. Arrows flow outward to show that these are representations of the same semantic state rather than competing sources of truth.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>
      .title{font:700 30px system-ui,sans-serif;fill:#0f172a}.label{font:700 21px system-ui,sans-serif;fill:#0f172a}.body{font:17px system-ui,sans-serif;fill:#334155}.small{font:15px system-ui,sans-serif;fill:#475569}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="660" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="title">One semantic state, many projections</text>

  <rect x="390" y="245" width="420" height="150" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="600" y="295" text-anchor="middle" class="label">Canonical knowledge</text>
  <text x="600" y="330" text-anchor="middle" class="body">Entities · revisions · relations · collections</text>
  <text x="600" y="362" text-anchor="middle" class="small">Authoritative semantic state in one exact snapshot</text>

  <rect x="55" y="95" width="260" height="105" rx="16" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
  <text x="185" y="137" text-anchor="middle" class="label">Markdown</text>
  <text x="185" y="170" text-anchor="middle" class="small">human-editable .md files</text>

  <rect x="55" y="455" width="260" height="105" rx="16" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
  <text x="185" y="497" text-anchor="middle" class="label">Rust source</text>
  <text x="185" y="530" text-anchor="middle" class="small">formatted .rs files</text>

  <rect x="885" y="95" width="260" height="105" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="1015" y="137" text-anchor="middle" class="label">Human transcript</text>
  <text x="1015" y="170" text-anchor="middle" class="small">chronological session view</text>

  <rect x="885" y="455" width="260" height="105" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="1015" y="497" text-anchor="middle" class="label">Agent context</text>
  <text x="1015" y="530" text-anchor="middle" class="small">compact task-oriented view</text>

  <rect x="470" y="505" width="260" height="105" rx="16" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
  <text x="600" y="547" text-anchor="middle" class="label">Interactive UI</text>
  <text x="600" y="580" text-anchor="middle" class="small">tree, editor, table, diff</text>

  <path d="M420 270 C350 225 300 190 285 180" class="line"/>
  <path d="M420 365 C350 420 300 470 285 485" class="line"/>
  <path d="M780 270 C850 225 900 190 915 180" class="line"/>
  <path d="M780 365 C850 420 900 470 915 485" class="line"/>
  <path d="M600 395 L600 505" class="line"/>

  <text x="355" y="215" text-anchor="middle" class="small">render with Markdown style</text>
  <text x="355" y="445" text-anchor="middle" class="small">render with source style</text>
  <text x="845" y="215" text-anchor="middle" class="small">render with chat style</text>
  <text x="845" y="445" text-anchor="middle" class="small">render with context policy</text>
  <text x="600" y="455" text-anchor="middle" class="small">render with view configuration</text>
</svg>