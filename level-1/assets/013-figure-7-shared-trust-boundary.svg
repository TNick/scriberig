<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Shared application trust boundary across product surfaces</title>
  <desc id="desc">CLI, TUI, web editor, API, agent runtime, and third-party product clients converge on shared application operations that enforce capabilities, validation, promotion, and external-operation policy before accessing the knowledge graph and store. Low-level storage embedding is a separate, explicit use case.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.h{font:700 28px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}.t{font:600 20px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}.s{font:400 17px system-ui,-apple-system,Segoe UI,sans-serif;fill:#334155}.tiny{font:400 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#475569}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:14}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14}.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:2;rx:14}.line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="55" class="h">Every product surface uses the same trust boundary</text>
  <rect x="65" y="110" width="150" height="80" class="box"/><text x="140" y="160" text-anchor="middle" class="t">CLI</text>
  <rect x="245" y="110" width="150" height="80" class="box"/><text x="320" y="160" text-anchor="middle" class="t">TUI</text>
  <rect x="425" y="110" width="150" height="80" class="box"/><text x="500" y="160" text-anchor="middle" class="t">Web editor</text>
  <rect x="605" y="110" width="150" height="80" class="box"/><text x="680" y="160" text-anchor="middle" class="t">HTTP / API</text>
  <rect x="785" y="110" width="150" height="80" class="box"/><text x="860" y="160" text-anchor="middle" class="t">Agent runtime</text>
  <rect x="965" y="110" width="170" height="80" class="box"/><text x="1050" y="160" text-anchor="middle" class="t">Third-party client</text>
  <rect x="285" y="290" width="630" height="150" class="blue"/><text x="600" y="330" text-anchor="middle" class="t">Shared application operations</text><text x="600" y="365" text-anchor="middle" class="s">capability enforcement • validation orchestration • promotion policy</text><text x="600" y="397" text-anchor="middle" class="s">external-operation policy • trust/provenance queries • semantic events</text>
  <path d="M140 190 V250 H390 V290" class="line"/><path d="M320 190 V250 H455 V290" class="line"/><path d="M500 190 V290" class="line"/><path d="M680 190 V290" class="line"/><path d="M860 190 V250 H745 V290" class="line"/><path d="M1050 190 V250 H810 V290" class="line"/>
  <rect x="315" y="520" width="260" height="90" class="green"/><text x="445" y="555" text-anchor="middle" class="t">Knowledge graph</text><text x="445" y="582" text-anchor="middle" class="s">semantic state</text>
  <rect x="625" y="520" width="260" height="90" class="box"/><text x="755" y="555" text-anchor="middle" class="t">Immutable store</text><text x="755" y="582" text-anchor="middle" class="s">structural invariants</text>
  <path d="M520 440 V480 H445 V520" class="line"/><path d="M680 440 V480 H755 V520" class="line"/>
  <text x="600" y="642" text-anchor="middle" class="tiny">Low-level embedding may deliberately bypass application policy; official product surfaces must not.</text>
</svg>