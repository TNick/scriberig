<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Workspaces isolate speculative changes until atomic promotion</title>
<desc id="desc">Named root main points to base snapshot S1. Three workspace attempts descend from S1: S2 fails compile, S3 fails tests, and S4 passes validation. Only S4 is eligible for promotion. Promotion compares the expected current root with main and either atomically advances main to S4 or reports a concurrency event if main already moved.</desc>
<style>.title{font:700 34px Arial,sans-serif;fill:#1f2937}.subtitle{font:400 18px Arial,sans-serif;fill:#4b5563}.boxTitle{font:700 21px Arial,sans-serif;fill:#111827}.body{font:400 16px Arial,sans-serif;fill:#374151}.small{font:400 14px Arial,sans-serif;fill:#6b7280}.good{font:700 16px Arial,sans-serif;fill:#166534}.bad{font:700 16px Arial,sans-serif;fill:#991b1b}.root{font:700 18px Arial,sans-serif;fill:#92400e}</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#64748b"/></marker></defs>
<rect width="1200" height="680" fill="#fff"/>
<text x="60" y="58" class="title">Speculative work is isolated until promotion</text>
<text x="60" y="90" class="subtitle">Failure creates another state, not corruption of the base.</text>
<rect x="70" y="155" width="190" height="70" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="125" y="188" class="root">main</text><text x="108" y="211" class="small">currently → S1</text>
<rect x="350" y="140" width="220" height="100" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="430" y="182" class="boxTitle">Snapshot S1</text><text x="409" y="213" class="body">immutable base</text>
<line x1="260" y1="190" x2="340" y2="190" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="265" y="340" width="210" height="110" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="340" y="380" class="boxTitle">Attempt S2</text><text x="321" y="410" class="bad">compile failed</text><text x="303" y="434" class="small">retain or discard by policy</text>
<rect x="495" y="340" width="210" height="110" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="570" y="380" class="boxTitle">Attempt S3</text><text x="555" y="410" class="bad">tests failed</text><text x="533" y="434" class="small">base S1 unchanged</text>
<rect x="725" y="340" width="210" height="110" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="800" y="380" class="boxTitle">Attempt S4</text><text x="775" y="410" class="good">validation passed</text><text x="778" y="434" class="small">eligible for promotion</text>
<line x1="440" y1="240" x2="370" y2="330" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><line x1="460" y1="240" x2="600" y2="330" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><line x1="480" y1="240" x2="830" y2="330" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="770" y="130" width="350" height="140" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="800" y="170" class="boxTitle">Atomic promotion</text><text x="800" y="202" class="body">expected: main → S1</text><text x="800" y="230" class="body">proposed: main → S4</text><text x="800" y="255" class="small">succeed only if expected value still matches</text>
<line x1="830" y1="340" x2="880" y2="280" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="205" y="530" width="790" height="92" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="600" y="565" text-anchor="middle" class="body">If another actor already moved main, promotion fails cleanly as a concurrency event.</text>
<text x="600" y="595" text-anchor="middle" class="body">The caller can inspect, merge, rebase, branch again, or abandon the proposal; S1 and every attempt remain immutable.</text>
</svg>