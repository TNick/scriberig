<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Canonical snapshots are separate from derived cache state</title>
  <desc id="desc">A blue canonical knowledge region contains entities, revisions, migrations, and Snapshot S1. Arrows leave Snapshot S1 toward purple derived artifacts such as a summary, index, and rendering. The derived artifacts live outside the canonical snapshot boundary, so creating or evicting them does not create Snapshot S2.</desc>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#111827">Canonical state and derived state have different lifecycles</text>
  <rect x="55" y="90" width="500" height="450" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="305" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#1d4ed8">Canonical knowledge</text>
  <rect x="115" y="170" width="380" height="88" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="305" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#111827">Entities + exact revisions</text>
  <text x="305" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#4b5563">accepted semantic state</text>
  <rect x="115" y="286" width="380" height="78" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="305" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#111827">Migrations + accepted provenance</text>
  <text x="305" y="346" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#4b5563">history of canonical change</text>
  <rect x="165" y="407" width="280" height="82" rx="18" fill="#2563eb"/>
  <text x="305" y="442" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Snapshot S1</text>
  <text x="305" y="468" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#dbeafe">exact canonical universe</text>

  <rect x="645" y="90" width="500" height="450" rx="20" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="895" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#6d28d9">Derived knowledge</text>
  <rect x="705" y="170" width="380" height="78" rx="14" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text x="895" y="204" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#111827">Summary D1</text>
  <text x="895" y="229" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">depends on exact revisions</text>
  <rect x="705" y="278" width="380" height="78" rx="14" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text x="895" y="312" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#111827">Index D2</text>
  <text x="895" y="337" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">rebuildable materialization</text>
  <rect x="705" y="386" width="380" height="78" rx="14" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text x="895" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#111827">Rendering D3</text>
  <text x="895" y="445" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">revision + style + renderer</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
  </defs>
  <path d="M445 448 C560 448 590 210 705 210" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M445 448 C560 448 590 317 705 317" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M445 448 C560 448 590 425 705 425" fill="none" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="596" y="505" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#374151">derive from S1</text>
  <text x="600" y="579" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#991b1b">Cache population or eviction does not create Snapshot S2</text>
</svg>