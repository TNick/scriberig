<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">External observations require freshness, and promotion to canonical knowledge is explicit</title>
  <desc id="desc">The top flow shows an external source producing immutable Observation R1 at time T1. A freshness policy decides whether R1 can be reused, must be revalidated, or should be replaced by a newer Observation R2. The bottom flow shows a derived observation passing through review or acceptance before becoming a canonical Decision and causing a new Snapshot. Computation alone does not promote the observation.</desc>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#111827">External truth has freshness; canonical truth requires explicit acceptance</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/></marker></defs>

  <text x="70" y="105" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#374151">A. Freshness of external observations</text>
  <g font-family="system-ui, sans-serif">
    <rect x="70" y="135" width="210" height="92" rx="15" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="175" y="170" text-anchor="middle" font-size="18" font-weight="700">External source X</text><text x="175" y="197" text-anchor="middle" font-size="14" fill="#4b5563">world may change independently</text>

    <rect x="355" y="135" width="235" height="92" rx="15" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="472" y="168" text-anchor="middle" font-size="18" font-weight="700">Observation R1</text><text x="472" y="194" text-anchor="middle" font-size="14" fill="#4b5563">observed at T1 + validator V1</text>

    <rect x="665" y="135" width="225" height="92" rx="15" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="777" y="168" text-anchor="middle" font-size="18" font-weight="700">Freshness policy</text><text x="777" y="194" text-anchor="middle" font-size="14" fill="#4b5563">age, validator, source rules</text>

    <rect x="960" y="92" width="180" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="1050" y="122" text-anchor="middle" font-size="16" font-weight="700">Reuse R1</text><text x="1050" y="145" text-anchor="middle" font-size="13" fill="#166534">still fresh enough</text>
    <rect x="960" y="182" width="180" height="70" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="1050" y="212" text-anchor="middle" font-size="16" font-weight="700">Revalidate</text><text x="1050" y="235" text-anchor="middle" font-size="13" fill="#92400e">confirm or fetch R2</text>
  </g>
  <path d="M280 181 L355 181" stroke="#4b5563" stroke-width="3" marker-end="url(#arrow)"/><path d="M590 181 L665 181" stroke="#4b5563" stroke-width="3" marker-end="url(#arrow)"/><path d="M890 165 C925 165 925 127 960 127" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M890 197 C925 197 925 217 960 217" fill="none" stroke="#4b5563" stroke-width="2.5" marker-end="url(#arrow)"/>

  <line x1="70" y1="305" x2="1130" y2="305" stroke="#e5e7eb" stroke-width="2"/>
  <text x="70" y="355" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#374151">B. Promotion from derived interpretation to canonical knowledge</text>
  <g font-family="system-ui, sans-serif">
    <rect x="90" y="400" width="245" height="100" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="212" y="438" text-anchor="middle" font-size="18" font-weight="700">Derived observation</text><text x="212" y="466" text-anchor="middle" font-size="14" fill="#4b5563">immutable + provenance</text>

    <rect x="475" y="400" width="245" height="100" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="597" y="438" text-anchor="middle" font-size="18" font-weight="700">Review / acceptance</text><text x="597" y="466" text-anchor="middle" font-size="14" fill="#4b5563">human or accepted workflow</text>

    <rect x="860" y="380" width="250" height="140" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="985" y="420" text-anchor="middle" font-size="18" font-weight="700">Canonical Decision</text><text x="985" y="448" text-anchor="middle" font-size="14" fill="#4b5563">retains provenance to observation</text><text x="985" y="484" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">→ new SnapshotId</text>
  </g>
  <path d="M335 450 L475 450" stroke="#4b5563" stroke-width="3" marker-end="url(#arrow)"/><path d="M720 450 L860 450" stroke="#4b5563" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="405" y="431" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">not automatic</text>
  <text x="600" y="615" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#991b1b">Fetching or generating a result does not by itself make it canonical.</text>
  <text x="600" y="648" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#4b5563">Immutable storage preserves what was observed; freshness and authority are separate decisions.</text>
</svg>