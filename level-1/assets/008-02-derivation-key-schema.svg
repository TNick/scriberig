<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Derivation key schema for exact cache reuse</title>
  <desc id="desc">Several exact inputs—revision IDs, scope or collection state, style or policy revision, implementation version, and freshness state—flow into a DerivationKey. The key selects an immutable DerivedResult. Provenance records which inputs and producer created the result. Omitting any meaning-changing input makes reuse unsafe.</desc>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#111827">A derivation key captures every input that can change meaning</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
  </defs>

  <g font-family="system-ui, sans-serif">
    <rect x="55" y="105" width="315" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="212" y="135" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Exact revision inputs</text>
    <text x="212" y="159" text-anchor="middle" font-size="14" fill="#4b5563">FR7, Type R2, Relation R9</text>

    <rect x="55" y="205" width="315" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="212" y="235" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Scope / completeness state</text>
    <text x="212" y="259" text-anchor="middle" font-size="14" fill="#4b5563">collection, index generation, snapshot</text>

    <rect x="55" y="305" width="315" height="72" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="212" y="335" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Style / policy revision</text>
    <text x="212" y="359" text-anchor="middle" font-size="14" fill="#4b5563">summary profile P3, style ST4</text>

    <rect x="55" y="405" width="315" height="72" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="212" y="435" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Implementation / environment</text>
    <text x="212" y="459" text-anchor="middle" font-size="14" fill="#4b5563">renderer V3, compiler, model config</text>

    <rect x="55" y="505" width="315" height="72" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="212" y="535" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Freshness state when needed</text>
    <text x="212" y="559" text-anchor="middle" font-size="14" fill="#4b5563">observation time, validator, expiry</text>

    <rect x="465" y="245" width="270" height="195" rx="20" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
    <text x="600" y="290" text-anchor="middle" font-size="22" font-weight="700" fill="#6d28d9">DerivationKey</text>
    <line x1="500" y1="315" x2="700" y2="315" stroke="#c4b5fd"/>
    <text x="600" y="345" text-anchor="middle" font-size="15" fill="#374151">derivation kind</text>
    <text x="600" y="372" text-anchor="middle" font-size="15" fill="#374151">ordered exact dependencies</text>
    <text x="600" y="399" text-anchor="middle" font-size="15" fill="#374151">versioned semantics</text>

    <rect x="835" y="205" width="310" height="168" rx="18" fill="#faf5ff" stroke="#9333ea" stroke-width="3"/>
    <text x="990" y="248" text-anchor="middle" font-size="21" font-weight="700" fill="#6b21a8">DerivedResult</text>
    <text x="990" y="284" text-anchor="middle" font-size="15" fill="#374151">immutable result identity</text>
    <text x="990" y="312" text-anchor="middle" font-size="15" fill="#374151">payload or artifact reference</text>
    <text x="990" y="340" text-anchor="middle" font-size="15" fill="#374151">success or cached failure</text>

    <rect x="835" y="415" width="310" height="140" rx="18" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
    <text x="990" y="452" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Provenance</text>
    <text x="990" y="484" text-anchor="middle" font-size="15" fill="#4b5563">producer + profile + inputs</text>
    <text x="990" y="512" text-anchor="middle" font-size="15" fill="#4b5563">why this result exists</text>
  </g>

  <path d="M370 141 C420 141 420 275 465 285" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M370 241 C425 241 425 310 465 320" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M370 341 L465 341" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M370 441 C425 441 425 382 465 374" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M370 541 C425 541 425 410 465 400" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M735 320 L835 285" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M990 373 L990 415" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="785" y="280" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#374151">lookup / compute</text>
  <rect x="390" y="620" width="420" height="50" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="600" y="651" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#991b1b">Never omit an input that can change the result's meaning</text>
</svg>