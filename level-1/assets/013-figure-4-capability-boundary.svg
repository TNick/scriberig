<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Capability enforcement boundary</title>
  <desc id="desc">An actor receives capabilities from the trusted runtime. Application operations enforce those capabilities before exposing the knowledge graph. Imported or generated content cannot create or widen permissions, and authorization is checked across traversal, search, summaries, and caches.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>.h{font:700 28px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}.t{font:600 20px system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}.s{font:400 17px system-ui,-apple-system,Segoe UI,sans-serif;fill:#334155}.tiny{font:400 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#475569}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:14}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14}.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:2;rx:14}.amber{fill:#fffbeb;stroke:#d97706;stroke-width:2;rx:14}.red{fill:#fef2f2;stroke:#dc2626;stroke-width:2;rx:14}.line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}</style></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="55" class="h">Capabilities are runtime authority; data cannot grant them</text>
  <rect x="70" y="125" width="210" height="105" class="blue"/><text x="175" y="162" text-anchor="middle" class="t">Actor / principal</text><text x="175" y="192" text-anchor="middle" class="s">human • agent • service</text>
  <rect x="355" y="125" width="225" height="105" class="amber"/><text x="468" y="162" text-anchor="middle" class="t">Capability set</text><text x="468" y="192" text-anchor="middle" class="s">scope + actions + constraints</text>
  <rect x="655" y="125" width="225" height="105" class="green"/><text x="768" y="162" text-anchor="middle" class="t">Application operations</text><text x="768" y="192" text-anchor="middle" class="s">inspect • query • propose • promote</text>
  <rect x="955" y="125" width="180" height="105" class="box"/><text x="1045" y="162" text-anchor="middle" class="t">Knowledge graph</text><text x="1045" y="192" text-anchor="middle" class="s">authorized view only</text>
  <path d="M280 177 H355" class="line"/><path d="M580 177 H655" class="line"/><path d="M880 177 H955" class="line"/>
  <rect x="80" y="360" width="330" height="115" class="red"/><text x="245" y="395" text-anchor="middle" class="t">Imported / generated content</text><text x="245" y="425" text-anchor="middle" class="s">may contain instructions</text><text x="245" y="452" text-anchor="middle" class="s">but is still data</text>
  <path d="M410 415 H620" class="dash"/><line x1="492" y1="385" x2="545" y2="445" stroke="#dc2626" stroke-width="6"/><line x1="545" y1="385" x2="492" y2="445" stroke="#dc2626" stroke-width="6"/><text x="518" y="475" text-anchor="middle" class="tiny">cannot mint or widen capability</text>
  <rect x="680" y="335" width="390" height="165" class="box"/><text x="875" y="372" text-anchor="middle" class="t">Scope is checked on every path</text><text x="875" y="405" text-anchor="middle" class="s">direct read</text><text x="875" y="432" text-anchor="middle" class="s">relation traversal • reverse lookup • search</text><text x="875" y="459" text-anchor="middle" class="s">summary • derived cache • tool result</text>
</svg>