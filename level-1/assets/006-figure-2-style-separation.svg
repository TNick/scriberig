<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Semantic content is independent from rendering style</title>
  <desc id="desc">One semantic Rust module is combined separately with Style A and Style B. Both render to different source layouts while pointing back to the same semantic module. The diagram emphasizes that style changes projection bytes without changing semantic identity.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>.title{font:700 30px system-ui,sans-serif;fill:#0f172a}.label{font:700 21px system-ui,sans-serif;fill:#0f172a}.body{font:17px system-ui,sans-serif;fill:#334155}.small{font:15px system-ui,sans-serif;fill:#475569}.mono{font:16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#334155}.line{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="title">Style changes representation, not semantic identity</text>

  <rect x="65" y="200" width="300" height="170" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="215" y="245" text-anchor="middle" class="label">Semantic module M</text>
  <text x="215" y="282" text-anchor="middle" class="body">same entities and revisions</text>
  <text x="215" y="317" text-anchor="middle" class="small">author-significant syntax preserved</text>
  <text x="215" y="345" text-anchor="middle" class="small">identity does not depend on whitespace</text>

  <rect x="455" y="110" width="265" height="130" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="588" y="150" text-anchor="middle" class="label">Style A</text>
  <text x="588" y="182" text-anchor="middle" class="small">max width 100</text>
  <text x="588" y="207" text-anchor="middle" class="small">compact arguments</text>

  <rect x="455" y="350" width="265" height="130" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="588" y="390" text-anchor="middle" class="label">Style B</text>
  <text x="588" y="422" text-anchor="middle" class="small">max width 70</text>
  <text x="588" y="447" text-anchor="middle" class="small">vertical arguments</text>

  <rect x="830" y="85" width="305" height="180" rx="18" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
  <text x="982" y="125" text-anchor="middle" class="label">Source projection A</text>
  <text x="860" y="168" class="mono">foo(alpha, beta, gamma);</text>
  <text x="982" y="220" text-anchor="middle" class="small">different bytes, same program state</text>

  <rect x="830" y="325" width="305" height="210" rx="18" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
  <text x="982" y="365" text-anchor="middle" class="label">Source projection B</text>
  <text x="860" y="405" class="mono">foo(</text>
  <text x="885" y="432" class="mono">alpha,</text>
  <text x="885" y="459" class="mono">beta,</text>
  <text x="885" y="486" class="mono">gamma,</text>
  <text x="860" y="513" class="mono">);</text>

  <path d="M365 245 C410 215 425 183 455 175" class="line"/>
  <path d="M365 325 C410 355 425 407 455 415" class="line"/>
  <path d="M720 175 L830 175" class="line"/>
  <path d="M720 415 L830 415" class="line"/>

  <text x="398" y="197" class="small">combine</text>
  <text x="398" y="382" class="small">combine</text>
  <text x="772" y="157" class="small">render</text>
  <text x="772" y="397" class="small">render</text>
</svg>