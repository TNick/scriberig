site_name: Scriberig
site_description: Design documentation for the Scriberig structured knowledge and agent platform.
site_url: https://tnick.github.io/scriberig/
repo_url: https://github.com/TNick/scriberig
repo_name: TNick/scriberig

# The workflow stages README.md and design/ here before building. Keeping the
# staging directory generated means the repository's Markdown stays canonical.
docs_dir: .pages/docs
site_dir: site

use_directory_urls: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
