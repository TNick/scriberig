[package]
name = "scriberig-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "Command parsing and dispatch for reusable Scriberig operations."
repository.workspace = true

[dependencies]
scriberig-secrets = { path = "../scriberig-secrets" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
blake3 = "1.8.2"
scriberig-core = { path = "../scriberig-core" }
scriberig-app = { path = "../scriberig-app" }
scriberig-client = { path = "../scriberig-client" }
scriberig-store-sqlite = { path = "../scriberig-store-sqlite" }
scriberig-store = { path = "../scriberig-store" }
sr-markdown = { path = "../sr-markdown" }
scriberig-project = { path = "../scriberig-project" }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
