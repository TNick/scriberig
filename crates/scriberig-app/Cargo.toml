[package]
name = "scriberig-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "Shared application-operation boundary used by all product and client surfaces."
repository.workspace = true

[dependencies]
scriberig-agent-core = { path = "../scriberig-agent-core" }
scriberig-core = { path = "../scriberig-core" }
scriberig-derive = { path = "../scriberig-derive" }
scriberig-graph = { path = "../scriberig-graph" }
scriberig-migration = { path = "../scriberig-migration" }
sr-projection = { path = "../sr-projection" }
scriberig-query = { path = "../scriberig-query" }
scriberig-session = { path = "../scriberig-session" }
scriberig-store = { path = "../scriberig-store" }
sr-change = { path = "../sr-change" }
sr-projection-fs = { path = "../sr-projection-fs" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rpi-ai = { workspace = true }
rpi-extensions = { workspace = true }
rpi-model-runtime = { workspace = true }

[dev-dependencies]
scriberig-domain-ecma = { path = "../domains/scriberig-domain-ecma" }
scriberig-store-memory = { path = "../scriberig-store-memory" }
scriberig-session-sqlite = { path = "../scriberig-session-sqlite", features = ["test-support"] }
scriberig-style-sqlite = { path = "../scriberig-style-sqlite" }
scriberig-store-sqlite = { path = "../scriberig-store-sqlite" }
tempfile = "3"

[lints]
workspace = true
