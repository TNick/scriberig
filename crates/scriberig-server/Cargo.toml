[package]
name = "scriberig-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
description = "Integrated server adapter exposing application operations through the public protocol."
repository.workspace = true
publish = false

[dependencies]
scriberig-core = { path = "../scriberig-core" }
scriberig-app = { path = "../scriberig-app" }
scriberig-protocol = { path = "../scriberig-protocol" }
scriberig-store-sqlite = { path = "../scriberig-store-sqlite" }
scriberig-store = { path = "../scriberig-store" }
scriberig-project = { path = "../scriberig-project" }
scriberig-domain-rust = { path = "../domains/scriberig-domain-rust" }
scriberig-domain-spreadsheet = { path = "../domains/scriberig-domain-spreadsheet" }
scriberig-domain-cad = { path = "../domains/scriberig-domain-cad" }
scriberig-domain-geo = { path = "../domains/scriberig-domain-geo" }
scriberig-query = { path = "../scriberig-query" }
scriberig-session = { path = "../scriberig-session" }
scriberig-session-sqlite = { path = "../scriberig-session-sqlite" }
scriberig-agent-core = { path = "../scriberig-agent-core" }
scriberig-agent-runtime = { path = "../scriberig-agent-runtime" }
rpi-ai = { workspace = true }
rpi-agent = { workspace = true }
rpi-model-runtime = { workspace = true }
sr-projection-fs = { path = "../sr-projection-fs" }
sr-projection = { path = "../sr-projection" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
blake3 = "1.8.2"

[lints]
workspace = true

[dev-dependencies]
dxf = "=0.6.2"
scriberig-client = { path = "../scriberig-client" }
scriberig-session = { path = "../scriberig-session" }
rxls = { version = "=0.1.4", default-features = false, features = ["xlsx"] }
scriberig-domain-ecma = { path = "../domains/scriberig-domain-ecma" }
rusqlite = { version = "0.40.2", features = ["bundled", "serialize"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
