[package]
name = "scriberig-agent-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
description = "Integrated agent execution, orchestration, and model-provider runtime."
repository.workspace = true
publish = false

[dependencies]
scriberig-secrets = { path = "../scriberig-secrets" }
zeroize = "1"
scriberig-agent-core = { path = "../scriberig-agent-core" }
scriberig-app = { path = "../scriberig-app" }
scriberig-core = { path = "../scriberig-core" }
scriberig-session = { path = "../scriberig-session" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
blake3 = "1.8"
rpi-ai = { git = "https://github.com/TNick/pi-rust", rev = "3a9006c13c031048ccd578f30d951cc41671acb7" }
rpi-agent = { git = "https://github.com/TNick/pi-rust", rev = "3a9006c13c031048ccd578f30d951cc41671acb7" }
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }

[lints]
workspace = true

[dev-dependencies]
scriberig-store = { path = "../scriberig-store" }
scriberig-store-memory = { path = "../scriberig-store-memory" }
scriberig-session-sqlite = { path = "../scriberig-session-sqlite" }
