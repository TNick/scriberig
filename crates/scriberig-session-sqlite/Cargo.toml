[package]
name = "scriberig-session-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "Durable SQLite repository for provider-neutral Scriberig sessions."
repository.workspace = true

[features]
test-support = []

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
scriberig-core = { path = "../scriberig-core" }
scriberig-session = { path = "../scriberig-session" }
scriberig-store = { path = "../scriberig-store" }
scriberig-store-sqlite = { path = "../scriberig-store-sqlite" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
