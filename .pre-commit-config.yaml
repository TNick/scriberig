default_install_hook_types: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: scriberig-conventions
        name: Scriberig repository conventions
        entry: python3 tools/repo_lint.py --fix
        language: system
        files: '\.(rs|ts|tsx|js|jsx|py)$'
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        files: '\.rs$'
        pass_filenames: false
      - id: cargo-check
        name: cargo check
        entry: cargo check --workspace --all-targets
        language: system
        files: '(^Cargo\.toml$|\.rs$)'
        pass_filenames: false
      - id: web-format
        name: web prettier write and restage
        entry: tools/precommit-web-format.sh
        language: system
        files: '^web/.*\.(ts|tsx|js|jsx)$'
      - id: web-typecheck
        name: web typecheck
        entry: pnpm --dir web typecheck
        language: system
        files: '^web/.*\.(ts|tsx|json)$'
        pass_filenames: false
