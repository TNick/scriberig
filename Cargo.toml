[workspace]
resolver = "3"
members = [
  "crates/scriberig-secrets",
  "crates/scriberig-core",
  "crates/scriberig-store",
  "crates/sr-change",
  "crates/scriberig-store-memory",
  "crates/scriberig-store-sqlite",
  "crates/scriberig-schema",
  "crates/scriberig-graph",
  "crates/scriberig-query",
  "crates/scriberig-migration",
  "crates/scriberig-derive",
  "crates/scriberig-projection",
  "crates/sr-projection",
  "crates/sr-projection-fs",
  "crates/sr-markdown",
  "crates/scriberig-session",
  "crates/scriberig-session-sqlite",
  "crates/scriberig-style-sqlite",
  "crates/scriberig-app",
  "crates/scriberig-protocol",
  "crates/scriberig-client",
  "crates/scriberig-agent-core",
  "crates/scriberig-agent-runtime",
  "crates/scriberig-server",
  "crates/scriberig-tui",
  "crates/scriberig-cli",
  "crates/scriberig-project",
  "crates/domains/scriberig-domain-markdown",
  "crates/domains/scriberig-domain-code",
  "crates/domains/scriberig-domain-rust",
  "crates/domains/scriberig-domain-pdf",
  "crates/domains/scriberig-domain-html",
  "crates/domains/scriberig-domain-ecma",
  "crates/domains/scriberig-domain-python",
  "crates/domains/scriberig-domain-c",
  "crates/domains/scriberig-domain-text",
  "crates/domains/scriberig-domain-data",
  "crates/domains/scriberig-domain-binary",
  "crates/domains/test-support",
  "crates/scriberig-conformance",
  "apps/scriberig",
  "tests/fixtures/provider-worker-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/TNick/scriberig"

[workspace.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Controlled TNick fork on `codex/extension-session-generations`, based on the
# reviewed upstream-ownership pin. It adds provider lifecycle events, atomic
# extension-session/catalog publication, plugin command UI continuation,
# reusable text-panel rendering, safe model/request fingerprints including
# prepared-body/allowlisted-header digests, safe typed model-configuration
# fingerprints, persistent Faux factories for concurrent deterministic runs,
# and retains the terminal fix.
rpi-ai = { git = "https://github.com/TNick/pi-rust", rev = "278cde7d20db1a5424153633b1808bc8c3928655" }
rpi-agent = { git = "https://github.com/TNick/pi-rust", rev = "278cde7d20db1a5424153633b1808bc8c3928655" }
rpi-extensions = { git = "https://github.com/TNick/pi-rust", rev = "278cde7d20db1a5424153633b1808bc8c3928655" }
rpi-model-runtime = { git = "https://github.com/TNick/pi-rust", rev = "278cde7d20db1a5424153633b1808bc8c3928655" }
rpi-tui = { git = "https://github.com/TNick/pi-rust", rev = "278cde7d20db1a5424153633b1808bc8c3928655" }
rpi-plugin-sdk = { git = "https://github.com/TNick/pi-rust", rev = "278cde7d20db1a5424153633b1808bc8c3928655" }

[workspace.lints.rust]
warnings = "deny"
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
