[workspace]
resolver = "3"
members = [
  "crates/scriberig-secrets",
  "crates/scriberig-core",
  "crates/scriberig-store",
  "crates/sr-change",
  "crates/scriberig-store-memory",
  "crates/scriberig-store-sqlite",
  "crates/scriberig-schema",
  "crates/scriberig-graph",
  "crates/scriberig-query",
  "crates/scriberig-migration",
  "crates/scriberig-derive",
  "crates/scriberig-projection",
  "crates/sr-projection",
  "crates/sr-projection-fs",
  "crates/sr-markdown",
  "crates/scriberig-session",
  "crates/scriberig-session-sqlite",
  "crates/scriberig-app",
  "crates/scriberig-protocol",
  "crates/scriberig-client",
  "crates/scriberig-agent-core",
  "crates/scriberig-agent-runtime",
  "crates/scriberig-server",
  "crates/scriberig-tui",
  "crates/scriberig-cli",
  "crates/scriberig-project",
  "crates/domains/scriberig-domain-markdown",
  "crates/domains/scriberig-domain-code",
  "crates/domains/scriberig-domain-rust",
  "crates/domains/scriberig-domain-pdf",
  "crates/domains/scriberig-domain-html",
  "crates/domains/scriberig-domain-ecma",
  "crates/domains/scriberig-domain-python",
  "crates/domains/scriberig-domain-c",
  "crates/domains/scriberig-domain-text",
  "crates/domains/scriberig-domain-data",
  "crates/domains/scriberig-domain-binary",
  "crates/domains/test-support",
  "crates/scriberig-conformance",
  "apps/scriberig",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/TNick/scriberig"

[workspace.dependencies]
# Controlled TNick fork at the 0.7.1 integration of upstream main
# 281dfddfa39ac063d86de57b75370974c4d75e6c and ScribeRig API extractions.
rpi-ai = { git = "https://github.com/TNick/pi-rust", rev = "6e65635a2ac2336a86847d85e2c3bb771a945c87" }
rpi-agent = { git = "https://github.com/TNick/pi-rust", rev = "6e65635a2ac2336a86847d85e2c3bb771a945c87" }
rpi-model-runtime = { git = "https://github.com/TNick/pi-rust", rev = "6e65635a2ac2336a86847d85e2c3bb771a945c87" }
rpi-tui = { git = "https://github.com/TNick/pi-rust", rev = "6e65635a2ac2336a86847d85e2c3bb771a945c87" }

[workspace.lints.rust]
warnings = "deny"
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
